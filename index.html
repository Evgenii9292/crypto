<script>
(() => {
  'use strict';
  let C=1000;
  const initial={BTC:76200,ETH:2247};
  const $=id=>document.getElementById(id);
  const el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));for(const c of children)n.append(c);return n};
  const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#${name}"></use></svg>`;
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dollars=(n,dec=2)=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const pct=(n)=>Number(n||0).toFixed(2)+'%';
  const signed=(n,type='money')=>(n<0?'−':'+')+(type==='money'?dollars(Math.abs(n)):pct(Math.abs(n)));
  const cls=n=>n>0.00001?'positive':n<-.00001?'negative':'neutral';
  const nowLocal=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const fmtDate=d=>{if(!d)return 'Нет даты';const a=d.slice(0,10).split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d};
  const fmtTime=d=>{if(!d)return '';const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  const s={tab:'overview',trades:[{id:1,coin:'BTC',spent:25,entry:76200,buy_date:'2026-11-06',confirmed:false},{id:2,coin:'ETH',spent:25,entry:2247,buy_date:'2026-11-06',confirmed:false}],quotes:{BTC:{price:initial.BTC,source:'Предварительно'},ETH:{price:initial.ETH,source:'Предварительно'}},capital:C,period:'7d',chartPeriod:{overview:'7d',spot:'7d',futures:'7d'},chartMetric:{spot:'pnl',futures:'pnl'},points:[],snapshots:[],sync:null,form:false,editing:null,deleteId:null,busy:false,flash:'',formError:'',showPrices:false,tradingSubtab:'futures',futureMode:'all',futureSort:'pnl',futureSortDir:-1,pnlMode:'all',settingsPane:'connections',portfolioSnapshots:[],pnlHistory:[],pendingRemove:null,renameId:null,renameValue:'',renameError:'',futureForm:null,futureFormError:'',sources:[{id:'bybit',name:'Bybit',connected:false,accounts:[]}],futuresPositions:[],openedExchanges:{},openedAccounts:{},spotHistoryOpen:false,spotAccountsOpen:false,spotOpen:{},bybitSnapshot:null,backendConnection:{available:false,configured:false,connected:false,error:''}};
  function coin(m){const trades=s.trades.filter(t=>t.coin===m);const invested=trades.reduce((t,x)=>t+Number(x.spent),0);const quantity=trades.reduce((t,x)=>t+Number(x.spent)/Number(x.entry),0);const current=Number(s.quotes[m]?.price||initial[m]);const value=quantity*current;return {invested,quantity,current,value,profit:value-invested,remaining:C/2-invested,avg:quantity?invested/quantity:0,provisional:trades.some(t=>!t.confirmed)}}
  function sums(){const btc=coin('BTC'),eth=coin('ETH'),invested=btc.invested+eth.invested,cash=C-invested,holdings=btc.value+eth.value,profit=holdings-invested;return {btc,eth,invested,cash,holdings,profit,total:cash+holdings}}

  function markStatus(){
    const q=s.quotes.BTC||{}, source=q.source||'Предварительно', fresh=source.startsWith('Bybit Spot')||source==='CoinGecko'||source==='CryptoCompare';
    const label=s.sync?.error?'Сеть недоступна · сохранённые цены':fresh?source+' · '+fmtTime(q.updated_at):source==='Вручную'?'Цены введены вручную':'Цены предварительные · уточни или обнови';
    return '<div class="status '+(s.sync?.error?'error':fresh?'ok':'stale')+'"><span class="dot"></span>'+escape(label)+'</div>';
  }
  function manualPricesHTML(){
    return '<form class="form" id="priceForm"><div class="formTitle">Изменить текущие курсы</div><div class="fieldrow"><div class="field"><label for="manualBTC">BTC, $</label><input id="manualBTC" name="BTC" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.BTC.price)+'" required></div><div class="field"><label for="manualETH">ETH, $</label><input id="manualETH" name="ETH" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.ETH.price)+'" required></div></div><button type="submit" class="btn primary full">Сохранить курсы</button></form>';
  }
function axisMoney(n){return (n<0?'−':n>0?'+':'')+'$'+(Math.abs(n)<10?Math.abs(n).toFixed(2):Math.abs(n)<100?Math.abs(n).toFixed(1):Math.round(Math.abs(n)).toLocaleString('en-US'))}
function portfolioSummary(){
 const a=sums(),snap=s.backendConnection.connected?s.bybitSnapshot:null;
 const positions=s.futuresPositions.filter(p=>p.exchangeId==='bybit');
 const known=!!snap&&positions.every(p=>p.initialMargin!=null&&Number.isFinite(Number(p.initialMargin)));
 const margin=known?positions.reduce((v,p)=>v+Number(p.initialMargin),0):null;
 const futuresPnl=snap&&snap.totals?.perpUPL!=null&&Number.isFinite(Number(snap.totals.perpUPL))?Number(snap.totals.perpUPL):null;
 return {spot:a,hasFutures:!!snap,margin,invested:!snap?a.invested:margin===null?null:a.invested+margin,
  futuresPnl,pnl:!snap?a.profit:futuresPnl===null?null:a.profit+futuresPnl};
}
const PERIODS={'24h':86400000,'7d':604800000,'30d':2592000000,'90d':7776000000,'6m':15552000000};
const PERIOD_NAMES={'24h':'24 часа','7d':'7 дней','30d':'30 дней','90d':'90 дней','6m':'6 месяцев'};
function pnlField(kind){return kind==='spot'?'spot':kind==='futures'?'futures':'total'}
function pnlSeries(kind){
 // Live readings are the finest detail we hold and always win. Durable server
 // history fills everything older, so month and half-year windows have real
 // points instead of an empty box. Never invent values for gaps.
 kind=kind||s.pnlMode;
 const field=pnlField(kind);
 let live;
 if(kind==='spot')live=s.snapshots.map(p=>({t:Number(p.time),v:Number(p.pnl)}));
 else live=s.portfolioSnapshots.map(p=>({t:Number(p.time),v:Number(p[field])}));
 live=live.filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v)).sort((a,b)=>a.t-b.t);
 const oldestLive=live.length?live[0].t:Infinity;
 const older=(s.pnlHistory||[]).map(p=>({t:Number(p.t),v:Number(p[field])}))
   .filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v)&&p.t<oldestLive).sort((a,b)=>a.t-b.t);
 if(kind==='all'&&!live.length&&!older.length&&!s.backendConnection.connected&&s.snapshots.length)
   return {kind,field,points:s.snapshots.map(p=>({t:Number(p.time),v:Number(p.pnl)})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v))};
 const seen=new Set();
 const points=older.concat(live).filter(p=>{if(seen.has(p.t))return false;seen.add(p.t);return true});
 return {kind,field,points};
}
function pnlWindow(kind,period){
 const from=Date.now()-(PERIODS[period]||PERIODS['7d']);
 const all=pnlSeries(kind).points,points=all.filter(p=>p.t>=from).slice(-1500);
 return {all,points,from,first:points.length?points[0].t:null,last:points.length?points[points.length-1].t:null};
}
function chartHTML(kind,period,shift){
 const win=pnlWindow(kind,period);
 // A balance view is the same series lifted by the money currently invested.
 // It is a derived line, not a second measurement, and the caption says so.
 const data=shift?win.points.map(p=>({t:p.t,v:p.v+shift})):win.points;
 if(data.length<2)return '<div class="emptychart"><strong>История PNL формируется</strong><span>После нескольких обновлений появится график с реальными датами. Историю не придумываем.</span></div>';
 const start=data[0].t,end=data[data.length-1].t,W=660,H=224,L=65,R=16,T=14,B=39;
 const vals=data.map(x=>x.v),min=Math.min(0,...vals),max=Math.max(0,...vals),spread=Math.max(max-min,.25),low=min-.18*spread,high=max+.18*spread;
 const x=t=>L+(t-start)/Math.max(1,end-start)*(W-L-R),y=v=>T+(high-v)/(high-low)*(H-T-B);
 let guide='';
 for(let k=0;k<=4;k++){let value=high-(high-low)*k/4,cy=y(value);guide+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+cy.toFixed(1)+'" y2="'+cy.toFixed(1)+'" class="chartGrid"/><text x="'+(L-9)+'" y="'+(cy+4).toFixed(1)+'" text-anchor="end" class="chartAxis">'+axisMoney(value)+'</text>'}
 const f=t=>period==='24h'?new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString('ru-RU',{month:'short',day:'numeric'});
 for(const fraction of [0,.5,1]){const tick=L+fraction*(W-L-R);guide+='<text x="'+tick+'" y="'+(H-10)+'" text-anchor="'+(fraction===0?'start':fraction===1?'end':'middle')+'" class="chartAxis">'+escape(f(start+(end-start)*fraction))+'</text>'}
 const pts=data.map(p=>x(p.t).toFixed(1)+','+y(p.v).toFixed(1)).join(' '),last=data[data.length-1],color=last.v<0?'var(--red)':'var(--green)';
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="График PNL с датами и значениями"><g>'+guide+'</g><line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" class="chartZero"/><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+x(last.t).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="4" fill="'+color+'"><title>'+escape(axisMoney(last.v)+' · '+new Date(last.t).toLocaleString('ru-RU'))+'</title></circle></svg>';
}
function chartCaption(kind,period,p,shift){
 const win=pnlWindow(kind,period);
 const scope=kind==='spot'?'Спот':kind==='futures'?'Фьючерсы':'Портфель';
 if(!win.points.length)return 'USD · '+scope+' · нет данных за '+PERIOD_NAMES[period];
 const days=Math.max(1,Math.round((win.last-win.first)/86400000));
 const span=days>=2?days+' дн.':Math.max(1,Math.round((win.last-win.first)/3600000))+' ч';
 const partial=win.first>win.from+86400000?' · история короче периода':'';
 const derived=shift?' · баланс = вложено сейчас + PNL':'';
 return 'USD · '+scope+' · '+span+partial+derived+(kind==='all'&&!p.hasFutures?' · сейчас только Спот':'');
}
function periodButtons(period,chart){
 return `<div class="periods">${[['24h','24ч'],['7d','7д'],['30d','30д'],['90d','90д'],['6m','6 мес']].map(([q,name])=>`<button type="button" data-period="${q}" data-chart="${chart}" class="period ${period===q?'active':''}">${name}</button>`).join('')}</div>`;
}
function pnlChartBlock(opts){
 // One chart component reused in three places (overview, spot, futures). Each
 // place owns its own period and metric so switching one does not move another.
 const key=opts.key,kind=opts.kind||s.pnlMode,period=s.chartPeriod[key]||'7d';
 const metric=opts.metricSwitch?(s.chartMetric[key]||'pnl'):'pnl';
 const current=opts.current==null?null:Number(opts.current);
 const subtitle=opts.subtitle===undefined?'Динамика результатов по позициям':opts.subtitle;
 const shift=metric==='balance'&&opts.invested!=null?Number(opts.invested):null;
 const showModes=!!opts.modes;
 const metricSwitch=opts.metricSwitch?`<div class="pnlMode"><button class="${metric==='pnl'?'active':''}" data-metric="pnl" data-chart="${key}" type="button">PNL</button><button class="${metric==='balance'?'active':''}" data-metric="balance" data-chart="${key}" type="button">Баланс</button></div>`:'';
 return `<section class="section pnlChart card"><div class="hrow pnlChartHead"><div><div class="sectitle">${opts.title||'Портфель'}</div>${subtitle?`<div class="tiny">${escape(subtitle)}</div>`:''}</div>${periodButtons(period,key)}</div>${showModes?`<div class="pnlMode">${[['all','Все'],['spot','Спот'],['futures','Фьючерсы']].map(([k,name])=>`<button class="${kind===k?'active':''}" data-pnl-mode="${k}" type="button">${name}</button>`).join('')}</div>`:''}${metricSwitch}<div class="chartbox">${chartHTML(kind,period,shift)}</div><div class="chartlegend"><span>${chartCaption(kind,period,opts.summary,shift)}</span><strong class="${current==null?'neutral':cls(current)}">${current==null?'—':signed(current)}</strong></div></section>`;
}
function spotPnlChart(){
 const p=portfolioSummary();
 const shown=s.pnlMode==='spot'?p.spot.profit:s.pnlMode==='futures'?p.futuresPnl:p.pnl;
 return pnlChartBlock({key:'overview',title:'Портфель',subtitle:'',modes:true,current:shown,summary:p});
}
function spotChartBlock(){
 const p=portfolioSummary(),a=p.spot;
 return pnlChartBlock({key:'spot',kind:'spot',title:'PNL · Спот',subtitle:'BTC, ETH и резерв на записанных покупках',
  metricSwitch:true,current:p.spot.profit,summary:p,invested:a.invested});
}
function futuresChartBlock(){
 const p=portfolioSummary();
 return pnlChartBlock({key:'futures',kind:'futures',title:'PNL · Фьючерсы',subtitle:'Плавающий результат открытых позиций',
  metricSwitch:true,current:p.futuresPnl,summary:p,invested:p.margin});
}
function spotDistribution(){
  const a=sums();
  return `<div class="bar"><span style="background:var(--btc);width:${a.total?Math.max(0,a.btc.value/a.total*100):0}%"></span><span style="background:var(--eth);width:${a.total?Math.max(0,a.eth.value/a.total*100):0}%"></span><span style="background:var(--reserve);flex:1"></span></div><div class="legend">${[['BTC',a.btc.value,'btc'],['ETH',a.eth.value,'eth'],['Резерв',a.cash,'reserve']].map(([name,value,color])=>`<div><div class="label"><i class="dot" style="background:var(--${color})"></i>${name}</div><strong>${pct(a.total?value/a.total*100:0)}</strong></div>`).join('')}</div>`;
}
function overviewSource(ex){
 const open=!!s.openedExchanges[ex.id],isBybit=ex.id==='bybit',count=ex.accounts.length+(isBybit?1:0);
 const a=sums();
 const inlineMetric=(current,lifetime)=>`<span class="accountMetrics"><span><small>Сейчас</small><b class="${current==null?'neutral':cls(current)}">${current==null?'—':signed(current)}</b></span><span><small>Всё время</small><b class="${lifetime==null?'neutral':cls(lifetime)}">${lifetime==null?'—':signed(lifetime)}</b></span></span>`;
 const spot=isBybit?`<div class="sourceSub"><button type="button" class="sourceSubHeader" data-action="toggleAccount" data-id="bybit:spot-fxmr4"><span class="accountIdentity"><strong>fxmr4</strong><span class="accountTag">Спот</span></span><span class="sourceSubRight">${inlineMetric(a.profit,a.profit)} <span class="chev ${s.openedAccounts['bybit:spot-fxmr4']?'rotated':''}">⌄</span></span></button>${s.openedAccounts['bybit:spot-fxmr4']?`<div class="sourcePositions">${[['BTC',coin('BTC')],['ETH',coin('ETH')]].map(([sym,x])=>`<div class="sourcePosition"><strong>${sym}</strong><span>${dollars(x.value)}</span><span class="${cls(x.profit)}">${signed(x.profit)}</span></div>`).join('')}</div>`:''}</div>`:'';
 const accounts=ex.accounts.map(ac=>{
  const id=ex.id+':'+ac.id,pp=s.futuresPositions.filter(p=>p.exchangeId===ex.id&&p.accountId===ac.id);
  const isLinked=isBybit&&ac.id==='bybit-subaccount'&&s.backendConnection.connected;
  const current=isLinked&&pp.every(p=>p.pnl!=null)?pp.reduce((sum,p)=>sum+Number(p.pnl),0):null;
  return `<div class="sourceSub"><div class="accountRow"><button type="button" class="sourceSubHeader" data-action="toggleAccount" data-id="${escape(id)}"><span class="accountIdentity"><strong>${escape(ac.name)}</strong><span class="accountTag">Фьючерсы</span></span><span class="sourceSubRight">${inlineMetric(current,null)} <span class="chev ${s.openedAccounts[id]?'rotated':''}">⌄</span></span></button><button class="accountManage" type="button" data-action="manageAccount" data-id="${escape(id)}" aria-label="Настройки ${escape(ac.name)}" title="Управление субаккаунтом">${icon('settings')}</button></div>${s.openedAccounts[id]?(pp.length?pp.map(futurePositionLine).join(''):'<div class="sourceEmpty">Нет открытых позиций или счёт не подключён.</div>'):''}</div>`;
 }).join('');
 const balance=isBybit&&s.backendConnection.connected&&s.bybitSnapshot?.totals?.equity!=null?dollars(s.bybitSnapshot.totals.equity):isBybit?dollars(a.total):'—';

function accountTotal(){
 // Money actually on the accounts: coins at market value plus futures equity.
 // The planned budget and its untouched reserve are not money we own.
 const p=portfolioSummary(),a=p.spot;
 const equity=p.hasFutures&&s.bybitSnapshot?.totals?.equity!=null?Number(s.bybitSnapshot.totals.equity):null;
 return equity==null?a.holdings:a.holdings+equity;
}
function pnlThirtyDayDelta(){
 // Monthly change in recorded floating PNL; never mislabel a short history
 // as a full-month result or invent one from live quotes.
 const series=pnlSeries('all').points,cutoff=Date.now()-PERIODS['30d'];
 if(series.length<2)return null;
 const baseline=series.filter(p=>p.t<=cutoff&&p.t>=cutoff-12*3600000).at(-1);
 const latest=series.at(-1);
 if(!baseline||!latest||latest.t<=cutoff||Date.now()-latest.t>6*3600000)return null;
 return latest.v-baseline.v;
}

function coinStack(symbols){
 // Overlapping round badges: which coins are open, without spelling each one out.
 const list=[...new Set(symbols.filter(Boolean))].slice(0,4);
 const extra=Math.max(0,[...new Set(symbols.filter(Boolean))].length-list.length);
 if(!list.length)return '';
 const label=sym=>{let t=String(sym).replace(/(USDT|USDC|USD|PERP)$/i,'');
  // 1000FLOKI is the contract name, not the coin: the badge shows FLOKI.
  const bare=t.replace(/^\d+/,'');if(bare.length>=3)t=bare;
  return t.slice(0,4);};
 return `<span class="coinStack">${list.map(sym=>`<i class="coinChip" title="${escape(String(sym))}">${escape(label(sym))}</i>`).join('')}${extra?`<i class="coinChip more">+${extra}</i>`:''}</span>`;
}

function futureSortValue(p,key){
 if(key==='size')return Number(p.size)||0;
 if(key==='symbol')return String(p.symbol||'').toLowerCase();
 if(key==='leverage')return Number(p.leverage)||0;
 if(key==='opened')return p.openedAt==null?-Infinity:Number(p.openedAt);

 return Number(p.pnl||0);
}
function futuresSorted(){

   return (x-y)*dir});
}

function bybitConnectorHead(){
 // The connection state is stated exactly once, here. The panel below shows
 // when the last sync happened and the actions, without repeating the state.
 const acc=String(s.bybitSnapshot?.account?.name||'').trim();
 const st=s.backendConnection;
 let sub,state;
 if(!st.available){sub='Сервер FXMR4 недоступен';state='off'}
 else if(st.connected){sub=(acc||'Субаккаунт')+' · только чтение';state='on'}
 else if(st.configured){sub='API-ключ добавлен';state='warn'}
 else{sub='API-ключ ещё не добавлен';state='off'}
 const badge=state==='on'?'<span class="connectBadge on"><i class="status-dot"></i>Подключено</span>'
   :state==='warn'?'<span class="connectBadge warn"><i class="status-dot"></i>Нужна синхронизация</span>':'';
 return `<div class="hrow connectorHead"><div class="logoArea"><div class="appicon">${icon('shield')}</div><div><div class="coinName">Bybit</div><div class="coinSub">${escape(sub)}</div></div></div>${badge}</div>`;
}

function exchangeFooterStatus(){
 const all=Array.isArray(s.sources)?s.sources:[];
 const failed=all.find(ex=>ex.connectionError||ex.needsReconnect||ex.status==='error');
 if(s.backendConnection.error&&s.backendConnection.configured&&!s.backendConnection.connected)
  return {text:'Bybit · нет связи',error:true,details:String(s.backendConnection.error)};
 if(failed)return {text:String(failed.name||'Биржа')+' · требуется проверка',error:true,details:String(failed.connectionError||'Нет подключения')};
 // An exchange added without an API is unconnected, not an expired key.
 const offline=all.find(ex=>!ex.connected&&(ex.id!=='bybit'||s.backendConnection.configured));
 if(offline)return {text:String(offline.name||'Биржа')+' · не подключена',error:true,details:'Нет действующего подключения'};
 const connected=all.filter(ex=>ex.connected);
 return connected.length?{text:'Биржи подключены',error:false,details:connected.map(ex=>ex.name).join(', ')}:{text:'Биржи не подключены',error:false,details:''};
}

function saveRenameAccount(id){

 const name=String(input?.value||s.renameValue||'').trim().slice(0,40);

}

function applyCloudState(){
 // Only user-authored state comes from VPS. Keep live Bybit account and
 // positions in memory while refreshing Spot purchases and account labels.
 const bybit=s.sources.find(x=>x.id==='bybit');
 const linked=bybit?.accounts?.find(x=>x.id==='bybit-subaccount');
 loadLocal();
 if(linked&&s.backendConnection.connected){
  let exchange=s.sources.find(x=>x.id==='bybit');
  if(!exchange){exchange={id:'bybit',name:'Bybit',connected:true,accounts:[]};s.sources.unshift(exchange)}
  exchange.connected=true;
  if(!exchange.accounts.some(x=>x.id==='bybit-subaccount'))exchange.accounts.push(linked);
 }
 render();
}
window.fxmr4App={onBackendStatus,onSnapshot,onDisconnected,applyCloudState};

  const storageKey='fxmr4_portfolio_public_preview_v1';
  function loadLocal(){
    try{
      const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
      if(!saved||typeof saved!=='object')return;
      if(Number.isFinite(Number(saved.capital))&&Number(saved.capital)>=100&&Number(saved.capital)<=1000000)C=Number(saved.capital);
       if(Array.isArray(saved.trades))s.trades=saved.trades.filter(t=>['BTC','ETH'].includes(t.coin)&&Number(t.spent)>0&&Number(t.entry)>0&&typeof t.buy_date==='string');
      for(const coin of ['BTC','ETH']){
        const q=saved.quotes?.[coin];
        if(q&&Number(q.price)>0&&Number.isFinite(Number(q.price)))s.quotes[coin]={price:Number(q.price),source:String(q.source||'Сохранено'),updated_at:q.updated_at||null};
      }
      if(Array.isArray(saved.snapshots))s.snapshots=saved.snapshots.filter(p=>Number.isFinite(p.time)&&Number.isFinite(p.pnl)).slice(-1500);
      if(Array.isArray(saved.portfolioSnapshots))s.portfolioSnapshots=saved.portfolioSnapshots.filter(p=>p&&Number.isFinite(Number(p.time))&&Number.isFinite(Number(p.total))&&Number.isFinite(Number(p.futures))).slice(-1500);
      if(saved.chartPeriod&&typeof saved.chartPeriod==='object'){
        for(const k of ['overview','spot','futures'])if(PERIODS[saved.chartPeriod[k]])s.chartPeriod[k]=saved.chartPeriod[k];
        s.period=s.chartPeriod.overview;
      }
      if(saved.chartMetric&&typeof saved.chartMetric==='object'){
        for(const k of ['spot','futures'])if(['pnl','balance'].includes(saved.chartMetric[k]))s.chartMetric[k]=saved.chartMetric[k];
      }
      if(saved.futureSort&&FUTURE_SORTS.some(([k])=>k===saved.futureSort))s.futureSort=saved.futureSort;
      if(saved.futureSortDir===-1||saved.futureSortDir===1)s.futureSortDir=saved.futureSortDir;
      if(Array.isArray(saved.sources)){const sources=saved.sources.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string').slice(0,25).map(x=>({id:x.id.slice(0,60),name:x.name.slice(0,60),connected:false,accounts:Array.isArray(x.accounts)?x.accounts.filter(y=>y&&typeof y.id==='string'&&typeof y.name==='string').slice(0,60).map(y=>({id:y.id.slice(0,60),name:y.name.slice(0,40),balance:null})):[]}));if(!sources.some(x=>x.id==='bybit'))sources.unshift({id:'bybit',name:'Bybit',connected:false,accounts:[]});s.sources=sources;}
    }catch(e){console.warn('Локальное сохранение:',e)}

  function chart(){

    if(s.tab==='overview'&&!s.showPrices&&!s.form)render();

  function recordSnapshot(){
    const p={time:Date.now(),pnl:sums().profit};
    const last=s.snapshots[s.snapshots.length-1];
    if(last&&p.time-last.time<1500&&Math.abs(last.pnl-p.pnl)<0.000001)return;
    s.snapshots.push(p);s.snapshots=s.snapshots.slice(-1500);recordPortfolioSnapshot();saveLocal(false);chart();
  }
  async function loadPnlHistory(){
    try{
      const r=await fetch('./api/pnl-history',{cache:'no-store',credentials:'same-origin',headers:{'Accept':'application/json'}});
      if(!r.ok)return;
      const data=await r.json();
      if(Array.isArray(data.points)){s.pnlHistory=data.points;if(s.tab==='overview')render()}
    }catch(e){/* offline: the local series still renders */}
  }
  let historyPushAt=0;
  async function pushPnlHistory(force=false){
    if(!s.backendConnection.available)return;
    const now=Date.now();
    if(!force&&now-historyPushAt<300000)return;
    historyPushAt=now;
    // Send only what the server cannot already have: the recent live readings.
    const points=s.portfolioSnapshots.slice(-400).map(p=>({t:p.time,spot:p.spot,futures:p.futures,total:p.total}))
      .filter(p=>Number.isFinite(p.t)&&(Number.isFinite(p.total)||Number.isFinite(p.spot)));
    if(!points.length)return;
    try{
      await fetch('./api/pnl-history',{method:'POST',cache:'no-store',credentials:'same-origin',
        headers:{'Content-Type':'application/json','X-FXMR4-Action':'1'},
        body:JSON.stringify({points})});
    }catch(e){/* the next push retries; nothing is lost locally */}
  }
  function recordPortfolioSnapshot(){
    const summary=portfolioSummary();
    // Spot PNL exists even with no futures account, so it is recorded on its
    // own. Futures and total stay absent, never zero, while they are unknown.
    const p={time:Date.now(),spot:summary.spot.profit};
    if(summary.hasFutures&&summary.futuresPnl!==null)p.futures=summary.futuresPnl;
    if(summary.pnl!==null)p.total=summary.pnl;
    const last=s.portfolioSnapshots[s.portfolioSnapshots.length-1];
    if(last&&p.time-last.time<1500&&Math.abs((last.total??last.spot)-(p.total??p.spot))<0.000001)return;
    s.portfolioSnapshots.push(p);s.portfolioSnapshots=s.portfolioSnapshots.slice(-1500);
    pushPnlHistory();
  }
  async function json(url){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),6500);
    try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal,headers:{'Accept':'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}
  }
function bybitQuotes(){
 const hosts=[['https://api.bybit.id','Bybit Spot (ID)'],['https://api.bybit.com','Bybit Spot'],['https://api.bytick.com','Bybit Spot (Alt)']];
 return Promise.any(hosts.map(async ([base,name])=>{
   const values=await Promise.all(['BTC','ETH'].map(async symbol=>{
     const x=await json(base+'/v5/market/tickers?category=spot&symbol='+symbol+'USDT');
     const value=Number(x?.result?.list?.[0]?.lastPrice);
     if(x?.retCode!==0||!(value>0))throw Error(name+': invalid quote');
     return value;
   }));
   return {BTC:values[0],ETH:values[1],source:name};
 }));
}
  async function coingeckoQuotes(){
    const r=await json('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin%2Cethereum&vs_currencies=usd');
    const a=Number(r?.bitcoin?.usd),b=Number(r?.ethereum?.usd);
    if(!(a>0&&b>0))throw Error('CoinGecko returned invalid quote');
    return {BTC:a,ETH:b,source:'CoinGecko'};
  }
  async function cryptocompareQuotes(){
    const r=await json('https://min-api.cryptocompare.com/data/pricemulti?fsyms=BTC%2CETH&tsyms=USD');
    const a=Number(r?.BTC?.USD),b=Number(r?.ETH?.USD);
    if(!(a>0&&b>0))throw Error('CryptoCompare returned invalid quote');
    return {BTC:a,ETH:b,source:'CryptoCompare'};
  }
  let lastSyncAttempt=0;
  async function sync(opts={}){
    const quiet=!!opts.quiet;
    if(s.busy)return;
    lastSyncAttempt=Date.now();s.busy=true;s.sync=null;
    if(!quiet&&!s.form&&!s.futureForm&&!s.showPrices)render();
    let success=false;
    for(const provider of [bybitQuotes,coingeckoQuotes,cryptocompareQuotes]){
      try{
        const q=await provider(),when=new Date().toISOString();
        s.quotes={BTC:{price:q.BTC,source:q.source,updated_at:when},ETH:{price:q.ETH,source:q.source,updated_at:when}};
        s.sync={source:q.source};
        if(!quiet)s.flash='Цены обновлены.';
        recordSnapshot();success=true;break;
      }catch(e){console.warn('Источник цен недоступен:',e.message)}
    }
    if(!success){s.sync={error:true};if(!quiet)s.flash='Источники цен недоступны. Используются сохранённые курсы.'}
    s.busy=false;
    if(!s.form&&!s.futureForm&&!s.showPrices)render();
  }

  function formOpen(id=null){s.tab='positions';s.spotHistoryOpen=true;s.form=true;s.editing=id;s.deleteId=null;s.formError='';s.flash='';render();$('tradeForm')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
  function saveTrade(fd){
    const coin=fd.get('coin'),spent=Number(fd.get('spent')),entry=Number(fd.get('entry')),buy_date=fd.get('buy_date'),account=String(fd.get('account')||'fxmr4').trim().slice(0,40);
    if(!account||!['BTC','ETH'].includes(coin)||!Number.isFinite(spent)||!Number.isFinite(entry)||spent<=0||entry<=0){s.formError='Проверь сумму и цену покупки.';render();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(buy_date)||buy_date>nowLocal()){s.formError='Проверь дату покупки.';render();return}
    const base=s.trades.filter(t=>t.id!==s.editing);
    if(base.filter(t=>t.coin===coin).reduce((a,t)=>a+Number(t.spent),0)+spent>C/2+0.0000001){s.formError='Лимит для '+coin+' составляет '+dollars(C/2)+'.';render();return}
    if(base.reduce((a,t)=>a+Number(t.spent),0)+spent>C+0.0000001){s.formError='Превышен общий бюджет $1 000.';render();return}
    const id=s.editing===null?Math.max(0,...s.trades.map(t=>Number(t.id)))+1:s.editing;
    const rec={id,coin,spent,entry,buy_date,account,confirmed:true};
    s.trades=s.editing===null?[...s.trades,rec]:s.trades.map(t=>t.id===id?rec:t);
    s.snapshots=[];s.points=[];s.form=false;s.editing=null;s.formError='';s.flash='Покупка сохранена. История PNL начнётся заново после изменения позиции.';recordSnapshot();saveLocal();render();
  }
  function removeTrade(id){
    s.trades=s.trades.filter(t=>t.id!==id);s.deleteId=null;s.snapshots=[];s.points=[];s.flash='Покупка удалена.';recordSnapshot();saveLocal();render();
  }
  function saveManualPrices(fd){
    const a=Number(fd.get('BTC')),b=Number(fd.get('ETH'));
    if(!(Number.isFinite(a)&&a>0&&Number.isFinite(b)&&b>0)){s.flash='Нужны корректные цены BTC и ETH.';render();return}
    const when=new Date().toISOString();
    s.quotes={BTC:{price:a,source:'Вручную',updated_at:when},ETH:{price:b,source:'Вручную',updated_at:when}};
    s.showPrices=false;s.sync=null;s.flash='Цены сохранены и PNL пересчитан.';recordSnapshot();saveLocal();render();
  }
function saveFutureForm(fd){
 const name=String(fd.get('name')||'').trim().slice(0,40);
 if(!name){s.futureFormError='Укажи название.';render();return}
 if(s.futureForm==='exchange'){
   if(s.sources.some(ex=>ex.name.toLowerCase()===name.toLowerCase())){s.futureFormError='Такая биржа уже добавлена.';render();return}
   const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36);
   s.sources.push({id,name,connected:false,accounts:[]});
   s.openedExchanges[id]=true;
 }else{
   const exchange=s.sources.find(ex=>ex.id===s.futureForm);
   if(!exchange){s.futureFormError='Биржа не найдена.';render();return}
   if(exchange.accounts.some(ac=>ac.name.toLowerCase()===name.toLowerCase())){s.futureFormError='Такой субаккаунт уже есть.';render();return}
   exchange.accounts.push({id:'sub-'+Date.now().toString(36),name,balance:null});
   s.openedExchanges[exchange.id]=true;
 }
 s.futureForm=null;s.futureFormError='';s.flash='Название сохранено. Для позиций потребуется API.';saveLocal();render();
}
function handleClick(e){
 const tab=e.target.closest('[data-tab]');
 if(tab){s.tab=tab.dataset.tab;s.flash='';s.form=false;s.deleteId=null;render();return}
 const pnl=e.target.closest('[data-pnl-mode]');
 if(pnl){s.pnlMode=pnl.dataset.pnlMode;render();return}
 const settings=e.target.closest('[data-settings-pane]');
 if(settings){s.settingsPane=settings.dataset.settingsPane;s.pendingRemove=null;render();return}
 const per=e.target.closest('[data-period]');
 if(per){const key=per.dataset.chart||'overview';s.chartPeriod[key]=per.dataset.period;if(key==='overview')s.period=per.dataset.period;chart();render();return}
 const met=e.target.closest('[data-metric]');
 if(met){s.chartMetric[met.dataset.chart]=met.dataset.metric;render();return}
 const sort=e.target.closest('[data-sort]');
 if(sort){const key=sort.dataset.sort;if(s.futureSort===key)s.futureSortDir*=-1;else{s.futureSort=key;s.futureSortDir=(key==='symbol'||key==='side')?1:-1}render();return}
 const mode=e.target.closest('[data-future-mode]');
 if(mode){s.futureMode=mode.dataset.futureMode;render();return}
 const btn=e.target.closest('[data-action]');if(!btn)return;
 const act=btn.dataset.action,id=btn.dataset.id||'';
 if(act==='sync'){sync();return}
 if(act==='gotoSpot'){s.tab='positions';render();return}
 if(act==='gotoFutures'||act==='backToFutures'){s.tab='futures';s.futureMode='exchange';render();return}
 if(act==='goConnections'){s.tab='connections';s.settingsPane='connections';render();return}
 if(act==='gotoCapital'){s.tab='connections';s.settingsPane='capital';render();return}
 if(act==='gotoOverview'){s.tab='overview';render();return}
 if(act==='manageAccount'){s.tab='connections';s.settingsPane='connections';s.pendingRemove=null;render();return}
 if(act==='removeAccount'){s.pendingRemove=id;s.renameId=null;render();return}
 if(act==='cancelRemoveAccount'){s.pendingRemove=null;render();return}
 if(act==='confirmRemoveAccount'){removeAccount(id);return}
 if(act==='renameAccount'){s.renameId=id;s.renameValue='';s.renameError='';s.pendingRemove=null;saveLocal(false);render();return}
 if(act==='cancelRenameAccount'){s.renameId=null;s.renameValue='';s.renameError='';render();return}
 if(act==='saveRenameAccount'){saveRenameAccount(id);return}
 if(act==='addAccountSettings'){s.futureForm=id;s.futureFormError='';render();return}
 if(act==='prices'){s.showPrices=!s.showPrices;render();return}
 if(act==='toggleExchange'){s.openedExchanges[id]=!s.openedExchanges[id];render();return}
 if(act==='toggleAccount'){s.openedAccounts[id]=!s.openedAccounts[id];render();return}
 if(act==='toggleSpotCoin'){s.spotOpen[id]=!s.spotOpen[id];render();return}
 if(act==='toggleHistory'){s.spotHistoryOpen=!s.spotHistoryOpen;s.form=false;render();return}
 if(act==='toggleSpotAccounts'){s.spotAccountsOpen=!s.spotAccountsOpen;render();return}
 if(act==='addExchange'){s.tab='futures';s.futureMode='exchange';s.futureForm='exchange';s.futureFormError='';render();return}
 if(act==='addAccount'){s.futureForm=id;s.futureFormError='';render();return}
 if(act==='closeFutureForm'){s.futureForm=null;s.futureFormError='';render();return}
 if(act==='new'){formOpen();return}
 if(act==='edit'){formOpen(Number(id));return}
 if(act==='delete'){s.deleteId=Number(id);render();return}
 if(act==='cancelDelete'){s.deleteId=null;render();return}
 if(act==='confirmDelete'){removeTrade(Number(id));return}
 if(act==='closeForm'){s.form=false;s.formError='';render();return}
}
function handleSubmit(e){
 if(e.target.id==='tradeForm'){e.preventDefault();saveTrade(new FormData(e.target))}
 if(e.target.id==='priceForm'){e.preventDefault();saveManualPrices(new FormData(e.target))}
 if(e.target.id==='futureForm'){e.preventDefault();saveFutureForm(new FormData(e.target))}
 if(e.target.classList?.contains('settingsRenameForm')){e.preventDefault();saveRenameAccount(e.target.dataset.renameId)}
 if(e.target.id==='capitalForm'){e.preventDefault();saveCapital(new FormData(e.target))}
}
function handleChange(e){
 if(e.target.id==='coin'&&s.editing===null){const input=$('entry');if(input)input.value=Number(s.quotes[e.target.value]?.price||initial[e.target.value])}
}
  document.addEventListener('click',handleClick);
  document.addEventListener('submit',handleSubmit);
  document.addEventListener('change',handleChange);
  window.fxmr4GetState=()=>({tab:s.tab,quotes:s.quotes,holdings:{BTC:coin('BTC'),ETH:coin('ETH')},capital:C});
  // Standalone web preview. Every edit is saved only in this browser, never to a public repository.
  loadLocal();render();chart();sync({quiet:true});loadPnlHistory();
  setInterval(()=>{if(!document.hidden&&!s.busy)sync({quiet:true})},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastSyncAttempt>60000)sync({quiet:true})});
})();
</script>
