<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafbfc" />
  <title>Мой портфель · fxmr4</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="wallet" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="16" rx="2"/><path d="M16 14h4M2 9h20M5 5V3h14"/></symbol>
    <symbol id="sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0-6v6h6M4 13a8 8 0 0 0 14.7 4.4L21 15m0 6v-6h-6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="m16 4 4 4M3 21l4.5-1 12.6-12.6a2.7 2.7 0 0 0-3.8-3.8L3.8 16.3 3 21Z"/></symbol>
    <symbol id="x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6m4-6v6"/></symbol>
    <symbol id="layers" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8h10M7 12h10M7 16h7"/></symbol>
    <symbol id="activity" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="shield" viewBox="0 0 24 24"><path d="M12 2 4 5v7c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5L12 2Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 3h.01M16 12h.01M9 16h6"/></symbol>
  </svg>
  <main class="page"><div class="shell">
    <aside class="sidebar">
      <header class="header"><div class="logoArea"><div class="appicon"><svg class="icon"><use href="#wallet"/></svg></div><div><div class="appname">Мой портфель</div><div class="account">fxmr4 · Spot</div></div></div><span class="pill">USD</span></header>
      <div class="navLabel">РАЗДЕЛЫ</div>
      <nav class="tabs" data-active="overview" role="tablist" aria-label="Разделы портфеля">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="overview"><svg class="icon"><use href="#activity"/></svg><span>Обзор</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="positions"><svg class="icon"><use href="#wallet"/></svg><span>Spot</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="futures"><svg class="icon"><use href="#trend"/></svg><span>Futures</span></button>
      </nav>
      <div class="sideFooter"><span class="status-dot"></span>Котировки · раз в 60 секунд<div class="tiny">Операции сохраняются в браузере</div><button class="btn navConfig" type="button" data-action="goConnections">Подключения</button><div class="tiny"></div></div>
    </aside>
    <section class="workspace">
      <div class="workspaceHead"><div><div class="workspaceEyebrow">FXMR4 / Личный кабинет</div><h1 id="pageTitle">Обзор</h1></div><div class="headActions"><button class="btn" type="button" data-action="goConnections">Подключения</button><span class="pill">USD</span></div></div>
      <div id="pnlRibbon" class="pnlRibbon"></div>
      <div id="content" class="pane" role="tabpanel" aria-live="polite"><div class="skeleton">Загружаю портфель…</div></div>
      <div id="message" aria-live="polite"></div>
      <p class="tiny storageNote">Изменения сохраняются только в этом браузере. Синхронизация с аккаунтом Bybit потребует защищённого сервера.</p>
    </section>
  </div></main>
<script>
(() => {
  'use strict';
  const C=1000;
  const initial={BTC:76200,ETH:2247};
  const $=id=>document.getElementById(id);
  const el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));for(const c of children)n.append(c);return n};
  const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#${name}"></use></svg>`;
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dollars=(n,dec=2)=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const pct=(n)=>Number(n||0).toFixed(2)+'%';
  const signed=(n,type='money')=>(n<0?'−':'+')+(type==='money'?dollars(Math.abs(n)):pct(Math.abs(n)));
  const cls=n=>n>0.00001?'positive':n<-.00001?'negative':'neutral';
  const nowLocal=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const fmtDate=d=>{if(!d)return 'Нет даты';const a=d.slice(0,10).split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d};
  const fmtTime=d=>{if(!d)return '';const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  const s={tab:'overview',trades:[{id:1,coin:'BTC',spent:25,entry:76200,buy_date:'2026-11-06',confirmed:false},{id:2,coin:'ETH',spent:25,entry:2247,buy_date:'2026-11-06',confirmed:false}],quotes:{BTC:{price:initial.BTC,source:'Предварительно'},ETH:{price:initial.ETH,source:'Предварительно'}},capital:C,period:'7d',points:[],snapshots:[],sync:null,form:false,editing:null,deleteId:null,busy:false,flash:'',formError:'',showPrices:false,tradingSubtab:'futures',futureMode:'exchange',futureSort:'pnl',futureForm:null,futureFormError:'',sources:[{id:'bybit',name:'Bybit',connected:false,accounts:[]}],futuresPositions:[],openedExchanges:{},openedAccounts:{},spotHistoryOpen:false,spotOpen:{}};
  function coin(m){const trades=s.trades.filter(t=>t.coin===m);const invested=trades.reduce((t,x)=>t+Number(x.spent),0);const quantity=trades.reduce((t,x)=>t+Number(x.spent)/Number(x.entry),0);const current=Number(s.quotes[m]?.price||initial[m]);const value=quantity*current;return {invested,quantity,current,value,profit:value-invested,remaining:500-invested,avg:quantity?invested/quantity:0,provisional:trades.some(t=>!t.confirmed)}}
  function sums(){const btc=coin('BTC'),eth=coin('ETH'),invested=btc.invested+eth.invested,cash=C-invested,holdings=btc.value+eth.value,profit=holdings-invested;return {btc,eth,invested,cash,holdings,profit,total:cash+holdings}}

  function markStatus(){
    const q=s.quotes.BTC||{}, source=q.source||'Предварительно', fresh=source.startsWith('Bybit Spot')||source==='CoinGecko'||source==='CryptoCompare';
    const label=s.sync?.error?'Сеть недоступна · сохранённые цены':fresh?source+' · '+fmtTime(q.updated_at):source==='Вручную'?'Цены введены вручную':'Цены предварительные · уточни или обнови';
    return '<div class="status '+(s.sync?.error?'error':fresh?'ok':'stale')+'"><span class="dot"></span>'+escape(label)+'</div>';
  }
  function manualPricesHTML(){
    return '<form class="form" id="priceForm"><div class="formTitle">Изменить текущие курсы</div><div class="fieldrow"><div class="field"><label for="manualBTC">BTC, $</label><input id="manualBTC" name="BTC" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.BTC.price)+'" required></div><div class="field"><label for="manualETH">ETH, $</label><input id="manualETH" name="ETH" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.ETH.price)+'" required></div></div><button type="submit" class="btn primary full">Сохранить курсы</button></form>';
  }
function axisMoney(n){return (n<0?'−':n>0?'+':'')+'$'+(Math.abs(n)<10?Math.abs(n).toFixed(2):Math.abs(n)<100?Math.abs(n).toFixed(1):Math.round(Math.abs(n)).toLocaleString('en-US'))}
function chartHTML(){
  const data=s.points.filter(p=>Number.isFinite(Number(p.pnl))&&Number.isFinite(Number(p.time))).slice(-1200);
  if(data.length<2)return '<div class="emptychart"><strong>История PNL формируется</strong><span>График появится после двух обновлений в разное время. Данные не моделируем.</span></div>';
  const start=data[0].time,end=data[data.length-1].time,W=660,H=224,L=65,R=16,T=14,B=39;
  const vals=data.map(x=>Number(x.pnl)),min=Math.min(0,...vals),max=Math.max(0,...vals),spread=Math.max(max-min,.25),low=min-.18*spread,high=max+.18*spread;
  const x=t=>L+(t-start)/Math.max(1,end-start)*(W-L-R),y=v=>T+(high-v)/(high-low)*(H-T-B);
  let guide='';
  for(let k=0;k<=4;k++){let value=high-(high-low)*k/4,cy=y(value);guide+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+cy.toFixed(1)+'" y2="'+cy.toFixed(1)+'" class="chartGrid"/><text x="'+(L-9)+'" y="'+(cy+4).toFixed(1)+'" text-anchor="end" class="chartAxis">'+axisMoney(value)+'</text>'}
  const f=t=>s.period==='24h'?new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString('ru-RU',{month:'short',day:'numeric'});
  for(const fraction of [0,.5,1]){const tick=L+fraction*(W-L-R);guide+='<text x="'+tick+'" y="'+(H-10)+'" text-anchor="'+(fraction===0?'start':fraction===1?'end':'middle')+'" class="chartAxis">'+escape(f(start+(end-start)*fraction))+'</text>'}
  const pts=data.map(p=>x(p.time).toFixed(1)+','+y(p.pnl).toFixed(1)).join(' '),last=data[data.length-1],color=last.pnl<0?'var(--red)':'var(--green)';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="График PNL с датами и значениями"><g>'+guide+'</g><line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" class="chartZero"/><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+x(last.time).toFixed(1)+'" cy="'+y(last.pnl).toFixed(1)+'" r="4" fill="'+color+'"><title>'+escape(axisMoney(last.pnl)+' · '+new Date(last.time).toLocaleString('ru-RU'))+'</title></circle></svg>';
}
function spotPnlChart(){
  const a=sums();return `<section class="section pnlChart card"><div class="hrow"><div><div class="sectitle">PNL · Spot</div><div class="tiny">История изменения результата</div></div><div class="periods">${['24h','7d','30d','90d'].map(p=>`<button type="button" data-period="${p}" class="period ${s.period===p?'active':''}">${p}</button>`).join('')}</div></div><div class="chartbox">${chartHTML()}</div><div class="chartlegend"><span>USD · даты и время снизу</span><strong class="${cls(a.profit)}">${signed(a.profit)}</strong></div></section>`;
}
function spotDistribution(){
  const a=sums();
  return `<div class="bar"><span style="background:var(--btc);width:${a.total?Math.max(0,a.btc.value/a.total*100):0}%"></span><span style="background:var(--eth);width:${a.total?Math.max(0,a.eth.value/a.total*100):0}%"></span><span style="background:var(--reserve);flex:1"></span></div><div class="legend">${[['BTC',a.btc.value,'btc'],['ETH',a.eth.value,'eth'],['Резерв',a.cash,'reserve']].map(([name,value,color])=>`<div><div class="label"><i class="dot" style="background:var(--${color})"></i>${name}</div><strong>${pct(a.total?value/a.total*100:0)}</strong></div>`).join('')}</div>`;
}
function overviewSource(ex){
  const open=!!s.openedExchanges[ex.id],isBybit=ex.id==='bybit',count=ex.accounts.length+(isBybit?1:0);
  const spot=isBybit?`<div class="sourceSub"><button type="button" class="sourceSubHeader" data-action="toggleAccount" data-id="bybit:spot-fxmr4"><span><strong>fxmr4</strong><span class="tiny">Spot · ручной учёт</span></span><span class="sourceSubRight">${dollars(sums().total)} <span class="chev ${s.openedAccounts['bybit:spot-fxmr4']?'rotated':''}">⌄</span></span></button>${s.openedAccounts['bybit:spot-fxmr4']?`<div class="sourcePositions">${[['BTC',coin('BTC')],['ETH',coin('ETH')]].map(([sym,x])=>`<div class="sourcePosition"><strong>${sym}</strong><span>${dollars(x.value)}</span><span class="${cls(x.profit)}">${signed(x.profit)}</span></div>`).join('')}</div>`:''}</div>`:'';
  const accounts=ex.accounts.map(ac=>{const id=ex.id+':'+ac.id;return `<div class="sourceSub"><button type="button" class="sourceSubHeader" data-action="toggleAccount" data-id="${escape(id)}"><span><strong>${escape(ac.name)}</strong><span class="tiny">Futures · ещё не подключён</span></span><span class="sourceSubRight">— <span class="chev ${s.openedAccounts[id]?'rotated':''}">⌄</span></span></button>${s.openedAccounts[id]?'<div class="sourceEmpty">Нет загруженных фьючерсных позиций.</div>':''}</div>`}).join('');
  return `<div class="sourceCard"><button type="button" class="sourceHeader" data-action="toggleExchange" data-id="${escape(ex.id)}"><div class="sourceLogo">${escape(ex.name.slice(0,1))}</div><span class="sourceName"><strong>${escape(ex.name)}</strong><span class="tiny">${count} аккаунтов · ${ex.connected?'API подключён':'без API'}</span></span><span class="sourceHeaderRight">${isBybit?dollars(sums().total)+' · Spot':'—'} <span class="chev ${open?'rotated':''}">⌄</span></span></button>${open?`<div class="sourceChildren">${spot}${accounts||''}${!count?'<div class="sourceEmpty">Аккаунтов пока нет.</div>':''}</div>`:''}</div>`;
}
function overview(){
  const a=sums();
  return `<div class="overview-layout"><div class="overview-primary">
    <div class="card tint overviewHero"><div class="eyebrow">Известный капитал</div><div class="total">${dollars(a.total)}</div><div class="performance"><span class="metric ${cls(a.profit)}">${signed(a.profit)} (${signed(a.invested?a.profit/a.invested*100:0,'pct')})</span><span class="tiny">PNL Spot</span></div><div class="hr"></div><div class="tiny">Учитывается пока только Spot. Общий баланс Futures появится после подключения бирж.</div></div>
    ${spotPnlChart()}</div><div class="overview-aside">
    <button class="assetSummary" type="button" data-action="gotoSpot"><span><span class="assetTitle">Spot</span><span class="assetSub">fxmr4 · BTC и ETH</span></span><span class="assetNumbers"><strong>${dollars(a.total)}</strong><span class="${cls(a.profit)}">${signed(a.profit)}</span></span></button>
    <button class="assetSummary" type="button" data-action="gotoFutures"><span><span class="assetTitle">Futures</span><span class="assetSub">Биржи и субаккаунты</span></span><span class="assetNumbers"><strong>—</strong><span class="tiny">Не подключено</span></span></button>
    <section class="section compactSection"><div class="hrow"><span class="sectitle">Распределение Spot</span><span class="tiny">Из ${dollars(a.total,0)}</span></div>${spotDistribution()}</section>
    </div></div>
    <section class="section sourcesBlock"><div class="hrow"><div><div class="sectitle">Биржи и субаккаунты</div><div class="tiny">Нажми на биржу, затем на аккаунт</div></div><button class="btn" data-action="gotoFutures">Все фьючерсы</button></div><div class="sourceList">${s.sources.map(overviewSource).join('')}</div></section>`;
}
function spotRow(symbol){
 const x=coin(symbol),a=sums(),open=!!s.spotOpen[symbol],tx=s.trades.filter(t=>t.coin===symbol),accounts=[...new Set(tx.map(t=>t.account||'fxmr4'))].join(', ')||'fxmr4';
 return `<div class="spotItem"><button type="button" class="spotItemHeader" data-action="toggleSpotCoin" data-id="${symbol}"><span class="coinleft"><span class="coinIcon ${symbol.toLowerCase()}">${symbol==='BTC'?'₿':'◆'}</span><span class="spotCoinLabel"><strong>${symbol==='BTC'?'Bitcoin':'Ethereum'}</strong><span class="tiny">${symbol} · ${escape(accounts)}</span></span></span><span class="spotNumbers"><strong>${dollars(x.value)}</strong><span class="${cls(x.profit)}">${signed(x.profit)} (${signed(x.invested?x.profit/x.invested*100:0,'pct')})</span></span><span class="chev ${open?'rotated':''}">⌄</span></button>${open?`<div class="spotDetails"><div><span>Вложено</span><strong>${dollars(x.invested)}</strong></div><div><span>Количество</span><strong>${x.quantity.toFixed(8)} ${symbol}</strong></div><div><span>Средняя покупка</span><strong>${x.avg?dollars(x.avg):'—'}</strong></div><div><span>Цена сейчас</span><strong>${dollars(x.current)}</strong></div><div><span>Доля всего Spot</span><strong>${pct(a.total?x.value/a.total*100:0)}</strong></div><div><span>Остаток лимита</span><strong>${dollars(x.remaining)}</strong></div></div>`:''}</div>`;
}
function history(){
 const tx=[...s.trades].sort((a,b)=>b.buy_date.localeCompare(a.buy_date)||b.id-a.id);
 return `<div class="historyBody"><div class="hrow"><div><div class="sectitle">Покупки</div><div class="tiny">Даты, суммы и аккаунты</div></div><button type="button" class="btn" data-action="new">${icon('plus')} Добавить</button></div>
 <div class="tradeList">${tx.length?tx.map(t=>`<div class="tradeLine"><div><strong>${t.coin}</strong><span class="tiny">${fmtDate(t.buy_date)} · ${escape(t.account||'fxmr4')}${!t.confirmed?' · предварительно':''}</span></div><div class="tradeAmount"><strong>${dollars(t.spent)}</strong><span class="tiny">по ${dollars(t.entry)}</span></div><div class="tradeActions"><button type="button" class="btn" aria-label="Изменить покупку" data-action="edit" data-id="${t.id}">${icon('edit')}</button><button type="button" class="btn danger" aria-label="Удалить покупку" data-action="delete" data-id="${t.id}">${icon('trash')}</button></div>${s.deleteId===t.id?`<div class="deleteConfirm">Удалить покупку? <button type="button" class="btn danger" data-action="confirmDelete" data-id="${t.id}">Удалить</button><button type="button" class="btn" data-action="cancelDelete">Отмена</button></div>`:''}</div>`).join(''):'<div class="sourceEmpty">Покупок пока нет.</div>'}</div>
 ${s.form?formHTML():''}
 <div class="tiny noteBelow">Начальные покупки по $25 имеют предварительные дату и цену входа. Уточни их для корректного PNL.</div></div>`;
}
function formHTML(){
 const edit=s.trades.find(t=>t.id===s.editing),o=edit||{coin:'BTC',spent:25,entry:s.quotes.BTC.price,buy_date:nowLocal(),account:'fxmr4'};
 return `<form id="tradeForm" class="form"><div class="hrow"><div class="formTitle">${edit?'Изменить покупку':'Новая покупка'}</div><button class="btn ghost" type="button" data-action="closeForm" aria-label="Закрыть">${icon('x')}</button></div>
 <div class="field"><label for="coin">Монета</label><select id="coin" name="coin"><option value="BTC" ${o.coin==='BTC'?'selected':''}>Bitcoin · BTC</option><option value="ETH" ${o.coin==='ETH'?'selected':''}>Ethereum · ETH</option></select></div>
 <div class="field"><label for="account">Аккаунт</label><input id="account" name="account" maxlength="40" value="${escape(o.account||'fxmr4')}" required></div>
 <div class="field"><label for="date">Дата покупки</label><input id="date" name="buy_date" type="date" max="${nowLocal()}" value="${escape(o.buy_date)}" required></div>
 <div class="fieldrow"><div class="field"><label for="spent">Сумма, $</label><input id="spent" name="spent" type="number" min=".01" max="500" step="any" inputmode="decimal" value="${Number(o.spent)}" required></div><div class="field"><label for="entry">Цена покупки, $</label><input id="entry" name="entry" type="number" min=".0000001" step="any" inputmode="decimal" value="${Number(o.entry)}" required></div></div>
 ${s.formError?`<div class="errorText">${escape(s.formError)}</div>`:''}<button class="btn primary full" type="submit">Сохранить покупку</button></form>`;
}
function quoteStrip(){
 return `<section class="section sectionline"><div class="hrow"><span class="sectitle">Текущие цены</span><div class="flexend"><button type="button" class="btn" data-action="prices">Цены</button><button type="button" class="btn" data-action="sync" ${s.busy?'disabled':''}>${icon('sync',s.busy?'spin':'')} ${s.busy?'Обновляю':'Обновить'}</button></div></div>${[['BTC','Bitcoin','₿','btc'],['ETH','Ethereum','◆','eth']].map(([m,name,sym,color])=>`<div class="priceRow"><div class="coinleft"><div class="coinIcon ${color}">${sym}</div><div><div class="coinName">${m}</div><div class="coinSub">${name}</div></div></div><span class="price">${dollars(coin(m).current)}</span></div>`).join('')}${markStatus()}${s.showPrices?manualPricesHTML():''}</section>`;
}
function positions(){
 const a=sums();
 return `<div class="spotTop"><div class="card tint"><div class="eyebrow">Spot · выделенный капитал</div><div class="total">${dollars(a.total)}</div><div class="performance"><span class="metric ${cls(a.profit)}">${signed(a.profit)} (${signed(a.invested?a.profit/a.invested*100:0,'pct')})</span><span class="tiny">PNL Spot</span></div></div>
 <div class="spotStats"><div class="card"><div class="eyebrow">В монетах</div><div class="num">${dollars(a.holdings)}</div></div><div class="card"><div class="eyebrow">Резерв</div><div class="num">${dollars(a.cash)}</div></div></div></div>
 <section class="section"><div class="hrow"><div><div class="sectitle">Монеты</div><div class="tiny">Нажми на строку для подробностей</div></div><button type="button" class="btn primary" data-action="new">${icon('plus')} Покупка</button></div><div class="spotList">${['BTC','ETH'].map(spotRow).join('')}</div></section>
 ${quoteStrip()}
 <div class="spotHistoryToggle"><button class="historyToggle" type="button" data-action="toggleHistory"><span>${icon('calendar')} История покупок <span class="historyCount">${s.trades.length}</span></span><span class="chev ${s.spotHistoryOpen?'rotated':''}">⌄</span></button>${s.spotHistoryOpen||s.form?history():''}</div>`;
}
function futuresSorted(){
 return [...s.futuresPositions].filter(p=>p&&p.symbol&&Number.isFinite(Number(p.size))).sort((a,b)=>s.futureSort==='symbol'?String(a.symbol).localeCompare(String(b.symbol)):s.futureSort==='size'?Number(b.size)-Number(a.size):Number(b.pnl||0)-Number(a.pnl||0));
}
function futurePositionLine(p){
 return `<div class="futurePosition"><span><strong>${escape(p.symbol)}</strong><span class="tiny">${escape(p.side||'')} ${p.leverage?escape(p.leverage+'×'):''}</span></span><span class="right"><strong>${dollars(p.size)}</strong><span class="tiny">Размер</span></span><span class="right ${cls(Number(p.pnl||0))}">${signed(Number(p.pnl||0))}<span class="tiny">PNL</span></span></div>`;
}
function futureExchangeCard(ex){
 const opened=!!s.openedExchanges[ex.id],positions=futuresSorted().filter(p=>p.exchangeId===ex.id);
 const accounts=ex.accounts.map(ac=>{const id=ex.id+':'+ac.id,open=!!s.openedAccounts[id],pp=positions.filter(p=>p.accountId===ac.id);
  return `<div class="sourceSub"><button type="button" class="sourceSubHeader" data-action="toggleAccount" data-id="${escape(id)}"><span><strong>${escape(ac.name)}</strong><span class="tiny">${pp.length?pp.length+' позиций':'Без данных API'}</span></span><span class="sourceSubRight">${ac.balance==null?'—':dollars(ac.balance)} <span class="chev ${open?'rotated':''}">⌄</span></span></button>${open?(pp.length?pp.map(futurePositionLine).join(''):'<div class="sourceEmpty">Позиции пока не загружены. Нужен API.</div>'):''}</div>`}).join('');
 return `<section class="sourceCard"><button type="button" class="sourceHeader" data-action="toggleExchange" data-id="${escape(ex.id)}"><span class="sourceLogo">${escape(ex.name.slice(0,1))}</span><span class="sourceName"><strong>${escape(ex.name)}</strong><span class="tiny">${ex.accounts.length} субаккаунтов · ${ex.connected?'Подключено':'Не подключено'}</span></span><span class="sourceHeaderRight">— <span class="chev ${opened?'rotated':''}">⌄</span></span></button>${opened?`<div class="sourceChildren">${accounts||'<div class="sourceEmpty">Субаккаунтов пока нет.</div>'}<div class="sourceAction"><button class="btn" type="button" data-action="addAccount" data-id="${escape(ex.id)}">${icon('plus')} Субаккаунт</button></div></div>`:''}</section>`;
}
function futuresByAccount(){
 const acc=s.sources.flatMap(ex=>ex.accounts.map(ac=>({ex,ac})));
 if(!acc.length)return '<div class="card emptyState"><div class="sectitle">Субаккаунты ещё не добавлены</div><p>В режиме «По биржам» раскрой биржу и добавь субаккаунт.</p></div>';
 return acc.map(({ex,ac})=>{const id=ex.id+':'+ac.id,open=!!s.openedAccounts[id],pos=futuresSorted().filter(p=>p.exchangeId===ex.id&&p.accountId===ac.id);
 return `<section class="sourceCard"><button type="button" class="sourceHeader" data-action="toggleAccount" data-id="${escape(id)}"><span class="sourceLogo">${escape(ex.name.slice(0,1))}</span><span class="sourceName"><strong>${escape(ac.name)}</strong><span class="tiny">${escape(ex.name)} · Futures</span></span><span class="sourceHeaderRight">— <span class="chev ${open?'rotated':''}">⌄</span></span></button>${open?(pos.length?pos.map(futurePositionLine).join(''):'<div class="sourceEmpty">Позиции не загружены.</div>'):''}</section>`}).join('');
}
function futuresForm(){
 if(!s.futureForm)return '';
 const addExchange=s.futureForm==='exchange';
 return `<form id="futureForm" class="form"><div class="hrow"><div class="formTitle">${addExchange?'Добавить биржу':'Добавить субаккаунт'}</div><button class="btn ghost" type="button" data-action="closeFutureForm">${icon('x')}</button></div>
 ${addExchange?'<div class="field"><label for="exchangeName">Биржа</label><select name="name" id="exchangeName"><option>Binance</option><option>OKX</option><option>Bitget</option><option>BingX</option><option>Gate</option><option>MEXC</option><option>Bybit</option></select></div>':`<div class="field"><label for="accountName">Название субаккаунта</label><input id="accountName" name="name" placeholder="Например, Futures 01" maxlength="40" required /></div><input type="hidden" name="exchangeId" value="${escape(s.futureForm)}">`}
 ${s.futureFormError?`<div class="errorText">${escape(s.futureFormError)}</div>`:''}
 <button class="btn primary full" type="submit">Сохранить</button><p class="tiny">Добавится только название. Биржевые деньги и позиции пока не загружаются.</p></form>`;
}
function futures(){
 const body=s.futureMode==='exchange'?s.sources.map(futureExchangeCard).join(''):s.futureMode==='account'?futuresByAccount():futuresSorted().length?futuresSorted().map(futurePositionLine).join(''):'<div class="card emptyState"><div class="sectitle">Нет загруженных позиций</div><p>После подключения появятся открытые сделки со всех бирж. Сортировка начнёт работать на полученных позициях.</p></div>';
 return `<div class="hrow"><div><div class="sectitle">Futures · Все биржи</div><div class="tiny">Баланс и позиции по биржам и субаккаунтам</div></div><button class="btn" data-action="goConnections" type="button">${icon('shield')} Подключения</button></div>
 <div class="futureMetrics">${[['Общий депозит','—'],['Плавающий PNL','—'],['Реализованный PNL','—'],['Открытые позиции','—']].map(([name,value])=>`<div class="card tint"><div class="eyebrow">${name}</div><div class="num">${value}</div></div>`).join('')}</div>
 <section class="section pnlChart card"><div class="hrow"><div class="sectitle">PNL · Futures</div><span class="pill">Ожидается API</span></div><div class="chartbox"><div class="emptychart"><strong>Пока нет данных для графика</strong><span>После подключения фьючерсов здесь будет PNL с датами, временной осью и шкалой USD.</span></div></div></section>
 <section class="section"><div class="futureToolbar"><div><div class="sectitle">Позиции и аккаунты</div><div class="tiny">Раскрывай биржи и выбирай способ группировки</div></div><button class="btn" type="button" data-action="addExchange">${icon('plus')} Биржа</button></div>
 <div class="futureFilters"><div class="tradeSwitch" role="tablist" aria-label="Группировка фьючерсов">${[['all','Все позиции'],['exchange','По биржам'],['account','По субаккаунтам']].map(([id,name])=>`<button type="button" data-future-mode="${id}" class="${s.futureMode===id?'active':''}">${name}</button>`).join('')}</div><label class="sortLabel">Сортировка <select id="futureSort"><option value="pnl" ${s.futureSort==='pnl'?'selected':''}>PNL</option><option value="size" ${s.futureSort==='size'?'selected':''}>Размер</option><option value="symbol" ${s.futureSort==='symbol'?'selected':''}>Монета</option></select></label></div>
 <div class="sourceList futureResults">${body}</div>${futuresForm()}
 <p class="tiny noteBelow">«—» означает отсутствие подключения, а не нулевой баланс. Биржи и имена аккаунтов сохраняются локально. Управление сделками пока недоступно.</p></section>`;
}
function connections(){
 return `<div class="hrow"><div><div class="sectitle">Подключения бирж</div><div class="tiny">Приватные данные требуют защищённого сервера</div></div><button class="btn" type="button" data-action="backToFutures">← Futures</button></div>
 <div class="card connectorCard"><div class="hrow"><div class="logoArea"><div class="appicon">${icon('shield')}</div><div><div class="coinName">Bybit</div><div class="coinSub">fxmr4 · приватный API не подключён</div></div></div><span class="connectBadge">Не подключено</span></div>
 <p class="connectCopy">Публичные котировки и данные счёта — разные вещи. Балансы, ордера и Futures можно получать после серверного подключения.</p>${markStatus()}
 <div class="safeNote">Не вводи API Secret на публичном сайте. Для подключения потребуется закрытый сервер с HTTPS, ключ только для чтения и ограничение IP. Без права торговли и вывода.</div>
 <div class="connectSteps"><div><span>01</span>Создать отдельный ключ Bybit Read-Only</div><div><span>02</span>Разрешить доступ только с IP твоего VPS</div><div><span>03</span>Проверить полученные балансы и позиции</div></div>
 <div class="flexend"><a class="btn externalLink" href="https://www.bybit.com/app/user/api-management" target="_blank" rel="noopener noreferrer">Bybit Global ↗</a><a class="btn externalLink" href="https://www.bybit.id/app/user/api-management" target="_blank" rel="noopener noreferrer">Bybit Indonesia ↗</a></div></div>
 <div class="warning">Если API-настройки не открываются по ссылке, зайди в Bybit на сайте и выбери «Профиль → API». В мобильном приложении создание ключей не поддерживается.</div>`;
}
function render(){
 const views={overview,positions,futures,connections};
 $('content').innerHTML=(views[s.tab]||overview)();
 $('content').classList.remove('pane');void $('content').offsetWidth;$('content').classList.add('pane');
 const titles={overview:'Обзор',positions:'Spot',futures:'Futures',connections:'Подключения'};
 $('pageTitle').textContent=titles[s.tab];
 const ribbon=$('pnlRibbon'),a=sums();
 ribbon.style.display=s.tab==='overview'?'none':'flex';
 ribbon.innerHTML='<span class="tiny">PNL Spot · fxmr4</span><strong class="'+cls(a.profit)+'">'+signed(a.profit)+' ('+signed(a.invested?a.profit/a.invested*100:0,'pct')+')</strong>';
 document.querySelector('.tabs').dataset.active=s.tab;
 document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===s.tab;b.classList.toggle('active',active);b.setAttribute('aria-selected',active?'true':'false')});
 $('message').innerHTML=s.flash?`<div class="toast">${escape(s.flash)}</div>`:'';
}

  const storageKey='fxmr4_portfolio_public_preview_v1';
  function loadLocal(){
    try{
      const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
      if(!saved||typeof saved!=='object')return;
      if(Array.isArray(saved.trades))s.trades=saved.trades.filter(t=>['BTC','ETH'].includes(t.coin)&&Number(t.spent)>0&&Number(t.entry)>0&&typeof t.buy_date==='string');
      for(const coin of ['BTC','ETH']){
        const q=saved.quotes?.[coin];
        if(q&&Number(q.price)>0&&Number.isFinite(Number(q.price)))s.quotes[coin]={price:Number(q.price),source:String(q.source||'Сохранено'),updated_at:q.updated_at||null};
      }
      if(Array.isArray(saved.snapshots))s.snapshots=saved.snapshots.filter(p=>Number.isFinite(p.time)&&Number.isFinite(p.pnl)).slice(-1500);
      if(Array.isArray(saved.sources)){const sources=saved.sources.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string').slice(0,25).map(x=>({id:x.id.slice(0,60),name:x.name.slice(0,60),connected:false,accounts:Array.isArray(x.accounts)?x.accounts.filter(y=>y&&typeof y.id==='string'&&typeof y.name==='string').slice(0,60).map(y=>({id:y.id.slice(0,60),name:y.name.slice(0,40),balance:null})):[]}));if(!sources.some(x=>x.id==='bybit'))sources.unshift({id:'bybit',name:'Bybit',connected:false,accounts:[]});s.sources=sources;}
    }catch(e){console.warn('Локальное сохранение:',e)}
  }
  function saveLocal(){
    try{localStorage.setItem(storageKey,JSON.stringify({trades:s.trades,quotes:s.quotes,snapshots:s.snapshots,sources:s.sources}))}catch(e){s.flash='Не удалось сохранить в браузере. Проверь режим приватности.';console.warn(e)}
  }
  function chart(){
    const windows={'24h':86400000,'7d':604800000,'30d':2592000000,'90d':7776000000};
    const from=Date.now()-(windows[s.period]||604800000);
    s.points=s.snapshots.filter(p=>p.time>=from);
    if(s.tab==='overview'&&!s.showPrices&&!s.form)render();
  }
  function recordSnapshot(){
    const p={time:Date.now(),pnl:sums().profit};
    const last=s.snapshots[s.snapshots.length-1];
    if(last&&p.time-last.time<1500&&Math.abs(last.pnl-p.pnl)<0.000001)return;
    s.snapshots.push(p);s.snapshots=s.snapshots.slice(-1500);saveLocal();chart();
  }
  async function json(url){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),6500);
    try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal,headers:{'Accept':'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}
  }
function bybitQuotes(){
 const hosts=[['https://api.bybit.id','Bybit Spot (ID)'],['https://api.bybit.com','Bybit Spot'],['https://api.bytick.com','Bybit Spot (Alt)']];
 return Promise.any(hosts.map(async ([base,name])=>{
   const values=await Promise.all(['BTC','ETH'].map(async symbol=>{
     const x=await json(base+'/v5/market/tickers?category=spot&symbol='+symbol+'USDT');
     const value=Number(x?.result?.list?.[0]?.lastPrice);
     if(x?.retCode!==0||!(value>0))throw Error(name+': invalid quote');
     return value;
   }));
   return {BTC:values[0],ETH:values[1],source:name};
 }));
}
  async function coingeckoQuotes(){
    const r=await json('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin%2Cethereum&vs_currencies=usd');
    const a=Number(r?.bitcoin?.usd),b=Number(r?.ethereum?.usd);
    if(!(a>0&&b>0))throw Error('CoinGecko returned invalid quote');
    return {BTC:a,ETH:b,source:'CoinGecko'};
  }
  async function cryptocompareQuotes(){
    const r=await json('https://min-api.cryptocompare.com/data/pricemulti?fsyms=BTC%2CETH&tsyms=USD');
    const a=Number(r?.BTC?.USD),b=Number(r?.ETH?.USD);
    if(!(a>0&&b>0))throw Error('CryptoCompare returned invalid quote');
    return {BTC:a,ETH:b,source:'CryptoCompare'};
  }
  let lastSyncAttempt=0;
  async function sync(opts={}){
    const quiet=!!opts.quiet;
    if(s.busy)return;
    lastSyncAttempt=Date.now();s.busy=true;s.sync=null;
    if(!quiet&&!s.form&&!s.showPrices)render();
    let success=false;
    for(const provider of [bybitQuotes,coingeckoQuotes,cryptocompareQuotes]){
      try{
        const q=await provider(),when=new Date().toISOString();
        s.quotes={BTC:{price:q.BTC,source:q.source,updated_at:when},ETH:{price:q.ETH,source:q.source,updated_at:when}};
        s.sync={source:q.source};
        if(!quiet)s.flash='Цены обновлены: '+q.source+'.';
        recordSnapshot();success=true;break;
      }catch(e){console.warn('Источник цен недоступен:',e.message)}
    }
    if(!success){s.sync={error:true};if(!quiet)s.flash='Источники цен недоступны. Используются сохранённые курсы.'}
    s.busy=false;
    if(!s.form&&!s.showPrices)render();
  }
  function flash(msg){s.flash=msg;render()}
  function formOpen(id=null){s.tab='positions';s.spotHistoryOpen=true;s.form=true;s.editing=id;s.deleteId=null;s.formError='';s.flash='';render();$('tradeForm')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
  function saveTrade(fd){
    const coin=fd.get('coin'),spent=Number(fd.get('spent')),entry=Number(fd.get('entry')),buy_date=fd.get('buy_date'),account=String(fd.get('account')||'fxmr4').trim().slice(0,40);
    if(!account||!['BTC','ETH'].includes(coin)||!Number.isFinite(spent)||!Number.isFinite(entry)||spent<=0||entry<=0){s.formError='Проверь сумму и цену покупки.';render();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(buy_date)||buy_date>nowLocal()){s.formError='Проверь дату покупки.';render();return}
    const base=s.trades.filter(t=>t.id!==s.editing);
    if(base.filter(t=>t.coin===coin).reduce((a,t)=>a+Number(t.spent),0)+spent>500.0000001){s.formError='Лимит для '+coin+' составляет $500.';render();return}
    if(base.reduce((a,t)=>a+Number(t.spent),0)+spent>C+0.0000001){s.formError='Превышен общий бюджет $1 000.';render();return}
    const id=s.editing===null?Math.max(0,...s.trades.map(t=>Number(t.id)))+1:s.editing;
    const rec={id,coin,spent,entry,buy_date,account,confirmed:true};
    s.trades=s.editing===null?[...s.trades,rec]:s.trades.map(t=>t.id===id?rec:t);
    s.snapshots=[];s.points=[];s.form=false;s.editing=null;s.formError='';s.flash='Покупка сохранена. История PNL начнётся заново после изменения позиции.';recordSnapshot();saveLocal();render();
  }
  function removeTrade(id){
    s.trades=s.trades.filter(t=>t.id!==id);s.deleteId=null;s.snapshots=[];s.points=[];s.flash='Покупка удалена.';recordSnapshot();saveLocal();render();
  }
  function saveManualPrices(fd){
    const a=Number(fd.get('BTC')),b=Number(fd.get('ETH'));
    if(!(Number.isFinite(a)&&a>0&&Number.isFinite(b)&&b>0)){s.flash='Нужны корректные цены BTC и ETH.';render();return}
    const when=new Date().toISOString();
    s.quotes={BTC:{price:a,source:'Вручную',updated_at:when},ETH:{price:b,source:'Вручную',updated_at:when}};
    s.showPrices=false;s.sync=null;s.flash='Цены сохранены и PNL пересчитан.';recordSnapshot();saveLocal();render();
  }
function saveFutureForm(fd){
 const name=String(fd.get('name')||'').trim().slice(0,40);
 if(!name){s.futureFormError='Укажи название.';render();return}
 if(s.futureForm==='exchange'){
   if(s.sources.some(ex=>ex.name.toLowerCase()===name.toLowerCase())){s.futureFormError='Такая биржа уже добавлена.';render();return}
   const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36);
   s.sources.push({id,name,connected:false,accounts:[]});
   s.openedExchanges[id]=true;
 }else{
   const exchange=s.sources.find(ex=>ex.id===s.futureForm);
   if(!exchange){s.futureFormError='Биржа не найдена.';render();return}
   if(exchange.accounts.some(ac=>ac.name.toLowerCase()===name.toLowerCase())){s.futureFormError='Такой субаккаунт уже есть.';render();return}
   exchange.accounts.push({id:'sub-'+Date.now().toString(36),name,balance:null});
   s.openedExchanges[exchange.id]=true;
 }
 s.futureForm=null;s.futureFormError='';s.flash='Название сохранено. Для позиций потребуется API.';saveLocal();render();
}
function handleClick(e){
 const tab=e.target.closest('[data-tab]');
 if(tab){s.tab=tab.dataset.tab;s.flash='';s.form=false;s.deleteId=null;render();return}
 const per=e.target.closest('[data-period]');
 if(per){s.period=per.dataset.period;chart();render();return}
 const mode=e.target.closest('[data-future-mode]');
 if(mode){s.futureMode=mode.dataset.futureMode;render();return}
 const btn=e.target.closest('[data-action]');if(!btn)return;
 const act=btn.dataset.action,id=btn.dataset.id||'';
 if(act==='sync'){sync();return}
 if(act==='gotoSpot'){s.tab='positions';render();return}
 if(act==='gotoFutures'||act==='backToFutures'){s.tab='futures';s.futureMode='exchange';render();return}
 if(act==='goConnections'){s.tab='connections';render();return}
 if(act==='prices'){s.showPrices=!s.showPrices;render();return}
 if(act==='toggleExchange'){s.openedExchanges[id]=!s.openedExchanges[id];render();return}
 if(act==='toggleAccount'){s.openedAccounts[id]=!s.openedAccounts[id];render();return}
 if(act==='toggleSpotCoin'){s.spotOpen[id]=!s.spotOpen[id];render();return}
 if(act==='toggleHistory'){s.spotHistoryOpen=!s.spotHistoryOpen;s.form=false;render();return}
 if(act==='addExchange'){s.tab='futures';s.futureMode='exchange';s.futureForm='exchange';s.futureFormError='';render();return}
 if(act==='addAccount'){s.futureForm=id;s.futureFormError='';render();return}
 if(act==='closeFutureForm'){s.futureForm=null;s.futureFormError='';render();return}
 if(act==='new'){formOpen();return}
 if(act==='edit'){formOpen(Number(id));return}
 if(act==='delete'){s.deleteId=Number(id);render();return}
 if(act==='cancelDelete'){s.deleteId=null;render();return}
 if(act==='confirmDelete'){removeTrade(Number(id));return}
 if(act==='closeForm'){s.form=false;s.formError='';render();return}
}
function handleSubmit(e){
 if(e.target.id==='tradeForm'){e.preventDefault();saveTrade(new FormData(e.target))}
 if(e.target.id==='priceForm'){e.preventDefault();saveManualPrices(new FormData(e.target))}
 if(e.target.id==='futureForm'){e.preventDefault();saveFutureForm(new FormData(e.target))}
}
function handleChange(e){
 if(e.target.id==='coin'&&s.editing===null){const input=$('entry');if(input)input.value=Number(s.quotes[e.target.value]?.price||initial[e.target.value])}
 if(e.target.id==='futureSort'){s.futureSort=e.target.value;render()}
}
  document.addEventListener('click',handleClick);
  document.addEventListener('submit',handleSubmit);
  document.addEventListener('change',handleChange);
  // Standalone web preview. Every edit is saved only in this browser, never to a public repository.
  loadLocal();render();chart();sync({quiet:true});
  setInterval(()=>{if(!document.hidden&&!s.busy)sync({quiet:true})},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastSyncAttempt>60000)sync({quiet:true})});
})();
</script>
