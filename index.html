<html lang="ru">
<head>

  <title>Мой портфель · fxmr4</title>
  <style>
    :root{color-scheme:light;--bg:#fafbfc;--surface:#fff;--surface2:#f5f6f8;--surface3:#edf0f4;--border:#e6e8ec;--text:#22262e;--muted:#858d99;--sub:#666f7b;--green:#168c58;--red:#dc4d52;--btc:#f2a23a;--eth:#7c8de8;--reserve:#8993a3;--radius:16px;--shadow:0 9px 34px rgba(22,30,45,.035)}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;font-weight:400}button,input,select{font:inherit}button{-webkit-tap-highlight-color:transparent;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}svg{display:block}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a4beff;outline-offset:2px}
    .page{max-width:588px;margin:32px auto 60px;padding:0 17px}.shell{border:1px solid var(--border);border-radius:22px;background:var(--surface);padding:18px;box-shadow:var(--shadow)}.header,.hrow,.r{display:flex;align-items:center;justify-content:space-between;gap:12px}.logoArea,.coinleft{display:flex;align-items:center;gap:10px}.appicon{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center}.icon{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.appicon .icon{width:20px;height:20px}.appname{font-size:15px;font-weight:660;letter-spacing:-.25px}.account,.tiny{font-size:12px;color:var(--muted)}.pill{padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--sub);font-size:11px;font-weight:620;letter-spacing:.25px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:var(--surface2);padding:4px;margin:18px 0 18px;border:1px solid var(--border);border-radius:12px}.tab{border:0;background:transparent;border-radius:9px;color:var(--sub);font-size:13px;font-weight:570;padding:10px 4px;transition:background .18s,color .18s,box-shadow .18s}.tabs{position:relative}.tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 14px)/3);background:var(--surface);border-radius:9px;box-shadow:0 1px 5px #00000011;transform:translateX(0);transition:transform .22s cubic-bezier(.2,.8,.2,1);pointer-events:none}.tabs[data-active="positions"]::before{transform:translateX(calc(100% + 3px))}.tabs[data-active="history"]::before{transform:translateX(calc(200% + 6px))}.tab{position:relative;z-index:1}.tab.active{background:transparent;color:var(--text);box-shadow:none}.pane{animation:appear .17s ease}@keyframes appear{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
    .card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--surface)}.card.tint{background:var(--surface2);border-color:transparent}.eyebrow{font-size:12px;color:var(--sub);margin-bottom:6px}.total{font-size:35px;font-weight:700;line-height:1.2;letter-spacing:-1.3px;font-variant-numeric:tabular-nums}.performance{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}.metric{font-weight:620;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--sub)}.subtle{color:var(--muted)}.hr{height:1px;background:var(--border);margin:15px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.num{font-size:21px;font-weight:670;letter-spacing:-.45px;font-variant-numeric:tabular-nums;margin-top:4px}.section{margin-top:20px}.sectitle{font-size:14px;font-weight:660;letter-spacing:-.15px}.bar{display:flex;width:100%;height:11px;overflow:hidden;border-radius:40px;background:var(--surface3);margin-top:11px}.bar>span{height:100%;transition:width .2s}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}.legend .label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)}.legend strong{display:block;font-size:13px;margin-top:4px;font-weight:660}
    .heading{font-size:14px;font-weight:680}.priceRow{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.coinIcon{height:34px;width:34px;display:grid;place-items:center;flex:none;color:white;border-radius:50%;font-size:21px;font-weight:620}.btc{background:var(--btc)}.eth{background:var(--eth)}.coinName{font-weight:620;font-size:13px}.coinSub{font-size:11px;color:var(--muted)}.right{text-align:right}.price{font-weight:670;font-variant-numeric:tabular-nums;font-size:13px}.sectionline{margin-top:16px;border-top:1px solid var(--border);padding-top:16px}.flexend{display:flex;justify-content:flex-end;gap:8px}
    .btn{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:12px;font-weight:610;transition:background .15s,transform .1s}.btn:hover{background:var(--surface2)}.btn:active{transform:scale(.98)}.btn.primary{background:var(--text);border-color:var(--text);color:var(--surface)}.btn.primary:hover{opacity:.87}.btn.danger{color:var(--red)}.btn.ghost{border:0;background:transparent}.btn.full{width:100%;height:41px}.btn .icon{width:14px;height:14px}.status{font-size:11px;color:var(--muted);margin-top:13px;display:flex;gap:5px;align-items:center}.status .dot{height:6px;width:6px}.status.error{color:var(--red)}.status.ok .dot{background:var(--green)}.status.stale .dot{background:#e2a33c}.status.error .dot{background:var(--red)}
    .pnlChart{margin-top:18px}.periods{display:flex;gap:4px}.period{background:none;border:0;color:var(--muted);border-radius:7px;font-size:11px;font-weight:580;padding:5px 7px}.period.active{background:var(--surface2);color:var(--text)}.chartbox{background:var(--surface2);border-radius:11px;margin-top:10px;min-height:115px;display:grid;place-items:center;overflow:hidden}.chartbox svg{width:100%;height:148px}.emptychart{text-align:center;padding:30px 14px;color:var(--muted);font-size:12px;max-width:280px}.chartlegend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}
    .coinCard{margin-top:12px}.coinCard:first-of-type{margin-top:0}.coinCard .top{display:flex;justify-content:space-between;align-items:center;gap:10px}.bigValue{font-size:19px;font-weight:680;letter-spacing:-.35px;font-variant-numeric:tabular-nums}.gain{font-size:12px;margin-top:2px;font-weight:580}.minirow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.minirow .dataLabel{font-size:11px;color:var(--muted)}.minirow .dataValue{font-size:13px;font-weight:610;font-variant-numeric:tabular-nums;margin-top:3px}.limit{margin-top:16px}.limit .bar{height:7px;margin-top:6px}.limit .note{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:11px}
    .tradecard{margin-top:10px}.tradecard .action{margin-top:10px;display:flex;justify-content:flex-end;gap:7px}.date{color:var(--muted);font-size:11px}.form{background:var(--surface2);border-radius:13px;padding:15px;margin-top:14px}.formTitle{font-weight:650;margin-bottom:13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:590;color:var(--sub)}.field input,.field select{min-width:0;width:100%;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:11px 10px;outline:0}.field input:focus,.field select:focus{border-color:#a1a8b5}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.errorText{color:var(--red);font-size:12px;margin:2px 0 10px}.warning{color:var(--sub);font-size:11px;margin-top:14px;line-height:1.5}.toast{margin-top:16px;background:#e6f7ed;color:#196342;border:1px solid #caeed8;padding:10px 12px;border-radius:10px;font-size:12px}.skeleton{padding:45px;text-align:center;color:var(--muted)}.confirmation{padding:10px;background:var(--surface2);border-radius:9px;margin-top:10px}.confirmText{font-size:12px;margin-bottom:9px}.spin{animation:spin 1.3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){body{background:var(--surface)}.page{padding:0;margin:0;max-width:none}.shell{border:0;border-radius:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 17px calc(env(safe-area-inset-bottom,0px) + 34px);box-shadow:none;min-height:100dvh}.total{font-size:34px}.tabs{margin-top:19px}.card{padding:15px}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101216;--surface:#191c22;--surface2:#252931;--surface3:#333945;--border:#343942;--text:#f3f4f6;--muted:#989fae;--sub:#bdc2cb;--green:#4ed69a;--red:#ff777d;--reserve:#8490a3;--shadow:none}.tabs::before{box-shadow:0 1px 6px #0003}.toast{background:#1a422d;color:#a4f1c0;border-color:#306143}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="wallet" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="16" rx="2"/><path d="M16 14h4M2 9h20M5 5V3h14"/></symbol>
    <symbol id="sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0-6v6h6M4 13a8 8 0 0 0 14.7 4.4L21 15m0 6v-6h-6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="m16 4 4 4M3 21l4.5-1 12.6-12.6a2.7 2.7 0 0 0-3.8-3.8L3.8 16.3 3 21Z"/></symbol>
    <symbol id="x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6m4-6v6"/></symbol>

  <main class="page"><div class="shell">
    <header class="header"><div class="logoArea"><div class="appicon"><svg class="icon"><use href="#wallet"/></svg></div><div><div class="appname">Мой портфель</div><div class="account">Аккаунт fxmr4 · Spot</div></div></div><span class="pill">USD</span></header>
    <nav class="tabs" data-active="overview" role="tablist" aria-label="Разделы портфеля">
      <button class="tab active" id="tab-overview" type="button" role="tab" aria-selected="true" data-tab="overview">Обзор</button>
      <button class="tab" id="tab-positions" type="button" role="tab" aria-selected="false" data-tab="positions">Позиции</button>

  </div></main>
<script>
(() => {
  'use strict';
  const C=1000;
  const initial={BTC:76200,ETH:2247};
  const $=id=>document.getElementById(id);
  const el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));for(const c of children)n.append(c);return n};
  const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#${name}"></use></svg>`;
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dollars=(n,dec=2)=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const pct=(n)=>Number(n||0).toFixed(2)+'%';
  const signed=(n,type='money')=>(n<0?'−':'+')+(type==='money'?dollars(Math.abs(n)):pct(Math.abs(n)));
  const cls=n=>n>0.00001?'positive':n<-.00001?'negative':'neutral';
  const nowLocal=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const fmtDate=d=>{if(!d)return 'Нет даты';const a=d.slice(0,10).split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d};
  const fmtTime=d=>{if(!d)return '';const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  const s={tab:'overview',trades:[{id:1,coin:'BTC',spent:25,entry:76200,buy_date:'2026-11-06',confirmed:false},{id:2,coin:'ETH',spent:25,entry:2247,buy_date:'2026-11-06',confirmed:false}],quotes:{BTC:{price:initial.BTC,source:'Предварительно'},ETH:{price:initial.ETH,source:'Предварительно'}},capital:C,period:'7d',points:[],snapshots:[],sync:null,form:false,editing:null,deleteId:null,busy:false,flash:'',formError:'',showPrices:false};
  function coin(m){const trades=s.trades.filter(t=>t.coin===m);const invested=trades.reduce((t,x)=>t+Number(x.spent),0);const quantity=trades.reduce((t,x)=>t+Number(x.spent)/Number(x.entry),0);const current=Number(s.quotes[m]?.price||initial[m]);const value=quantity*current;return {invested,quantity,current,value,profit:value-invested,remaining:500-invested,avg:quantity?invested/quantity:0,provisional:trades.some(t=>!t.confirmed)}}
  function sums(){const btc=coin('BTC'),eth=coin('ETH'),invested=btc.invested+eth.invested,cash=C-invested,holdings=btc.value+eth.value,profit=holdings-invested;return {btc,eth,invested,cash,holdings,profit,total:cash+holdings}}

  function markStatus(){
    const q=s.quotes.BTC||{}, source=q.source||'Предварительно', fresh=source==='Bybit Spot'||source==='CoinGecko'||source==='CryptoCompare';
    const label=s.sync?.error?'Сеть недоступна · сохранённые цены':fresh?source+' · '+fmtTime(q.updated_at):source==='Вручную'?'Цены введены вручную':'Цены предварительные · уточни или обнови';
    return '<div class="status '+(s.sync?.error?'error':fresh?'ok':'stale')+'"><span class="dot"></span>'+escape(label)+'</div>';
  }
  function manualPricesHTML(){
    return '<form class="form" id="priceForm"><div class="formTitle">Изменить текущие курсы</div><div class="fieldrow"><div class="field"><label for="manualBTC">BTC, $</label><input id="manualBTC" name="BTC" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.BTC.price)+'" required></div><div class="field"><label for="manualETH">ETH, $</label><input id="manualETH" name="ETH" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.ETH.price)+'" required></div></div><button type="submit" class="btn primary full">Сохранить курсы</button></form>';
  }
  function overview(){const a=sums();const percent=a.invested?a.profit/a.invested*100:0;return `
    <div class="card tint"><div class="eyebrow">Стоимость портфеля</div><div class="total">${dollars(a.total)}</div><div class="performance"><span class="metric ${cls(a.profit)}">${signed(a.profit)} (${signed(percent,'pct')})</span><span class="tiny">от покупок</span></div><div class="hr"></div><div class="twocol"><div><div class="eyebrow">В монетах</div><div class="num">${dollars(a.holdings)}</div></div><div><div class="eyebrow">Свободно</div><div class="num">${dollars(a.cash)}</div></div></div></div>
    <section class="section pnlChart"><div class="hrow"><div class="sectitle">График PNL</div><div class="periods">${['24h','7d','30d','90d'].map(p=>`<button type="button" data-period="${p}" class="period ${s.period===p?'active':''}">${p}</button>`).join('')}</div></div><div class="chartbox" id="chartSlot">${chartHTML()}</div><div class="chartlegend"><span>Изменение прибыли с начала наблюдений</span><span>USD</span></div></section>
    <section class="section"><div class="hrow"><span class="sectitle">Распределение капитала</span><span class="tiny">Из $1 000</span></div><div class="bar"><span style="background:var(--btc);width:${a.total?Math.max(0,a.btc.value/a.total*100):0}%"></span><span style="background:var(--eth);width:${a.total?Math.max(0,a.eth.value/a.total*100):0}%"></span><span style="background:var(--reserve);flex:1"></span></div><div class="legend">${[['BTC',a.btc.value,'btc'],['ETH',a.eth.value,'eth'],['Резерв',a.cash,'reserve']].map(([n,v,c])=>`<div><div class="label"><i class="dot" style="background:var(--${c})"></i>${n}</div><strong>${pct(a.total?v/a.total*100:0)}</strong></div>`).join('')}</div></section>
    <section class="section sectionline"><div class="hrow"><span class="sectitle">Текущие цены</span><div class="flexend"><button type="button" class="btn" data-action="prices">Цены</button><button type="button" class="btn" data-action="sync" ${s.busy?'disabled':''}>${icon('sync',s.busy?'spin':'')} ${s.busy?'Обновляю':'Обновить'}</button></div></div>${[['BTC','Bitcoin','₿','btc'],['ETH','Ethereum','◆','eth']].map(([m,name,sym,color])=>`<div class="priceRow"><div class="coinleft"><div class="coinIcon ${color}">${sym}</div><div><div class="coinName">${m}</div><div class="coinSub">${name}</div></div></div><span class="price">${dollars(coin(m).current)}</span></div>`).join('')}${markStatus()}${s.showPrices?manualPricesHTML():''}</section>`}
  function chartHTML(){const d=s.points.filter(p=>typeof p.pnl==='number'&&Number.isFinite(p.pnl));if(d.length<2)return `<div class="emptychart">График появится после нескольких обновлений котировок. Историю до первого запуска не придумываем.</div>`;const vals=d.map(x=>x.pnl);let min=Math.min(...vals),max=Math.max(...vals);let span=Math.max(max-min,Math.max(1,Math.abs(max))*.08);min-=span*.13;max+=span*.13;const W=520,H=148,P=14;const xy=(v,i)=>[P+i*(W-2*P)/(vals.length-1),P+(max-v)/(max-min)*(H-2*P)];const pts=vals.map((v,i)=>xy(v,i).join(',')).join(' ');const y0=P+(max-0)/(max-min)*(H-2*P);const neg=vals.at(-1)<vals[0];const color=neg?'var(--red)':'var(--green)';const last=xy(vals.at(-1),vals.length-1);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="График прибыли за выбранный период"><path d="M${P} ${y0}H${W-P}" stroke="var(--border)" stroke-dasharray="4 5" fill="none"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="${color}"/></svg>`}
  function positions(){const a=sums();return `<div class="hrow"><div><div class="sectitle">Мои монеты</div><div class="tiny">2 актива · аккаунт fxmr4</div></div><button class="btn" data-action="new">${icon('plus')} Купить</button></div>${[['BTC','Bitcoin','₿','btc',a.btc],['ETH','Ethereum','◆','eth',a.eth]].map(([m,name,sym,color,x])=>`<section class="card coinCard"><div class="top"><div class="coinleft"><div class="coinIcon ${color}">${sym}</div><div><div class="coinName">${name}</div><div class="coinSub">${m} · fxmr4</div></div></div><div class="right"><div class="bigValue">${dollars(x.value)}</div><div class="gain ${cls(x.profit)}">${signed(x.profit)} (${signed(x.invested?x.profit/x.invested*100:0,'pct')})</div></div></div><div class="minirow"><div><div class="dataLabel">Вложено</div><div class="dataValue">${dollars(x.invested)}</div></div><div><div class="dataLabel">Доля портфеля</div><div class="dataValue">${pct(a.total?x.value/a.total*100:0)}</div></div><div><div class="dataLabel">Средняя покупка</div><div class="dataValue">${x.avg?dollars(x.avg):'—'}</div></div><div><div class="dataLabel">Цена сейчас</div><div class="dataValue">${dollars(x.current)}</div></div></div><div class="limit"><div class="note"><span>Лимит $500</span><span>${dollars(x.remaining)} осталось</span></div><div class="bar"><span style="background:var(--${color});width:${Math.max(0,x.invested/500*100)}%"></span></div></div>${x.provisional?'<div class="warning">Есть покупки с неподтверждённой датой или ценой входа.</div>':''}</section>`).join('')}`}
  function history(){const trades=[...s.trades].sort((a,b)=>b.buy_date.localeCompare(a.buy_date)||b.id-a.id);return `<div class="hrow"><div class="sectitle">История покупок</div><button class="btn primary" data-action="new">${icon('plus')} Добавить</button></div>${trades.length?trades.map(t=>`<section class="card tradecard"><div class="hrow"><div><div class="coinName">${t.coin} · Покупка</div><div class="date">${fmtDate(t.buy_date)}${!t.confirmed?' · предварительно':''}</div></div><div class="right"><div class="price">${dollars(t.spent)}</div><div class="date">По ${dollars(t.entry)}</div></div></div><div class="action"><button class="btn" data-action="edit" data-id="${t.id}">${icon('edit')} Изменить</button><button class="btn danger" data-action="delete" data-id="${t.id}">${icon('trash')} Удалить</button></div>${s.deleteId===t.id?`<div class="confirmation"><div class="confirmText">Удалить эту покупку? Действие нельзя отменить.</div><div class="flexend"><button class="btn" data-action="cancelDelete">Отмена</button><button class="btn danger" data-action="confirmDelete" data-id="${t.id}">Удалить</button></div></div>`:''}</section>`).join(''):'<div class="warning">Покупок пока нет.</div>'}${s.form?formHTML():''}<div class="warning">Начальные покупки по $25 имеют предварительную дату и цену входа. Уточни фактические данные через «Изменить», иначе PNL будет приблизительным.</div>`}
  function formHTML(){const edit=s.trades.find(t=>t.id===s.editing);const o=edit||{coin:'BTC',spent:25,entry:s.quotes.BTC.price,buy_date:nowLocal()};return `<form id="tradeForm" class="form"><div class="hrow"><div class="formTitle">${edit?'Изменить покупку':'Новая покупка'}</div><button class="btn ghost" type="button" data-action="closeForm" aria-label="Закрыть">${icon('x')}</button></div><div class="field"><label for="coin">Монета</label><select id="coin" name="coin"><option ${o.coin==='BTC'?'selected':''} value="BTC">Bitcoin · BTC</option><option ${o.coin==='ETH'?'selected':''} value="ETH">Ethereum · ETH</option></select></div><div class="field"><label for="date">Дата покупки</label><input id="date" name="buy_date" type="date" max="${nowLocal()}" value="${escape(o.buy_date)}" required/></div><div class="fieldrow"><div class="field"><label for="spent">Сумма, $</label><input id="spent" name="spent" type="number" inputmode="decimal" min="0.01" max="500" step="any" value="${Number(o.spent)}" required/></div><div class="field"><label for="entry">Цена покупки, $</label><input id="entry" name="entry" type="number" inputmode="decimal" min="0.0000001" step="any" value="${Number(o.entry)}" required/></div></div>${s.formError?`<div class="errorText">${escape(s.formError)}</div>`:''}<button type="submit" class="btn full primary" ${s.busy?'disabled':''}>${s.busy?'Сохраняю…':'Сохранить покупку'}</button></form>`}
  function render(){const view=s.tab==='overview'?overview():s.tab==='positions'?positions():history();$('content').innerHTML=view;$('content').classList.remove('pane');void $('content').offsetWidth;$('content').classList.add('pane');document.querySelector('.tabs').dataset.active=s.tab;document.querySelectorAll('[data-tab]').forEach(b=>{const is=b.dataset.tab===s.tab;b.classList.toggle('active',is);b.setAttribute('aria-selected',is?'true':'false')});$('message').innerHTML=s.flash?`<div class="toast">${escape(s.flash)}</div>`:''}

  const storageKey='fxmr4_portfolio_public_preview_v1';
  function loadLocal(){
    try{
      const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
      if(!saved||typeof saved!=='object')return;
      if(Array.isArray(saved.trades))s.trades=saved.trades.filter(t=>['BTC','ETH'].includes(t.coin)&&Number(t.spent)>0&&Number(t.entry)>0&&typeof t.buy_date==='string');
      for(const coin of ['BTC','ETH']){
        const q=saved.quotes?.[coin];
        if(q&&Number(q.price)>0&&Number.isFinite(Number(q.price)))s.quotes[coin]={price:Number(q.price),source:String(q.source||'Сохранено'),updated_at:q.updated_at||null};
      }
      if(Array.isArray(saved.snapshots))s.snapshots=saved.snapshots.filter(p=>Number.isFinite(p.time)&&Number.isFinite(p.pnl)).slice(-1500);
    }catch(e){console.warn('Локальное сохранение:',e)}
  }
  function saveLocal(){
    try{localStorage.setItem(storageKey,JSON.stringify({trades:s.trades,quotes:s.quotes,snapshots:s.snapshots}))}catch(e){s.flash='Не удалось сохранить в браузере. Проверь режим приватности.';console.warn(e)}
  }
  function chart(){
    const windows={'24h':86400000,'7d':604800000,'30d':2592000000,'90d':7776000000};
    const from=Date.now()-(windows[s.period]||604800000);
    s.points=s.snapshots.filter(p=>p.time>=from);
    if(s.tab==='overview')render();
  }
  function recordSnapshot(){
    const p={time:Date.now(),pnl:sums().profit};
    const last=s.snapshots[s.snapshots.length-1];
    if(last&&p.time-last.time<1500&&Math.abs(last.pnl-p.pnl)<0.000001)return;
    s.snapshots.push(p);s.snapshots=s.snapshots.slice(-1500);saveLocal();chart();
  }
  async function json(url){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),6500);
    try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal,headers:{'Accept':'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}
  }
  async function bybitQuotes(){
    const px=await Promise.all(['BTC','ETH'].map(async m=>{
      const x=await json('https://api.bybit.com/v5/market/tickers?category=spot&symbol='+m+'USDT');
      const val=Number(x?.result?.list?.[0]?.lastPrice);
      if(x?.retCode!==0||!Number.isFinite(val)||val<=0)throw Error('Bybit returned invalid quote');
      return val;
    }));
    return {BTC:px[0],ETH:px[1],source:'Bybit Spot'};
  }
  async function coingeckoQuotes(){
    const r=await json('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin%2Cethereum&vs_currencies=usd');
    const a=Number(r?.bitcoin?.usd),b=Number(r?.ethereum?.usd);
    if(!(a>0&&b>0))throw Error('CoinGecko returned invalid quote');
    return {BTC:a,ETH:b,source:'CoinGecko'};
  }
  async function cryptocompareQuotes(){
    const r=await json('https://min-api.cryptocompare.com/data/pricemulti?fsyms=BTC%2CETH&tsyms=USD');
    const a=Number(r?.BTC?.USD),b=Number(r?.ETH?.USD);
    if(!(a>0&&b>0))throw Error('CryptoCompare returned invalid quote');
    return {BTC:a,ETH:b,source:'CryptoCompare'};
  }
  async function sync(){
    if(s.busy)return;s.busy=true;s.sync=null;render();let success=false;
    for(const provider of [bybitQuotes,coingeckoQuotes,cryptocompareQuotes]){
      try{
        const q=await provider();
        const when=new Date().toISOString();
        s.quotes={BTC:{price:q.BTC,source:q.source,updated_at:when},ETH:{price:q.ETH,source:q.source,updated_at:when}};
        s.sync={source:q.source};s.flash='Цены обновлены: '+q.source+'.';recordSnapshot();success=true;break;
      }catch(e){console.warn('Источник цен недоступен:',e.message)}
    }
    if(!success){s.sync={error:true};s.flash='Автообновление недоступно. Нажми «Цены», чтобы задать курс вручную.'}
    s.busy=false;render();
  }
  function flash(msg){s.flash=msg;render()}
  function formOpen(id=null){s.tab='history';s.form=true;s.editing=id;s.deleteId=null;s.formError='';s.flash='';render();$('tradeForm')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
  function saveTrade(fd){
    const coin=fd.get('coin'),spent=Number(fd.get('spent')),entry=Number(fd.get('entry')),buy_date=fd.get('buy_date');
    if(!['BTC','ETH'].includes(coin)||!Number.isFinite(spent)||!Number.isFinite(entry)||spent<=0||entry<=0){s.formError='Проверь сумму и цену покупки.';render();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(buy_date)||buy_date>nowLocal()){s.formError='Проверь дату покупки.';render();return}
    const base=s.trades.filter(t=>t.id!==s.editing);
    if(base.filter(t=>t.coin===coin).reduce((a,t)=>a+Number(t.spent),0)+spent>500.0000001){s.formError='Лимит для '+coin+' составляет $500.';render();return}
    if(base.reduce((a,t)=>a+Number(t.spent),0)+spent>C+0.0000001){s.formError='Превышен общий бюджет $1 000.';render();return}
    const id=s.editing===null?Math.max(0,...s.trades.map(t=>Number(t.id)))+1:s.editing;
    const rec={id,coin,spent,entry,buy_date,confirmed:true};
    s.trades=s.editing===null?[...s.trades,rec]:s.trades.map(t=>t.id===id?rec:t);
    s.snapshots=[];s.points=[];s.form=false;s.editing=null;s.formError='';s.flash='Покупка сохранена. История PNL начнётся заново после изменения позиции.';recordSnapshot();saveLocal();render();
  }
  function removeTrade(id){
    s.trades=s.trades.filter(t=>t.id!==id);s.deleteId=null;s.snapshots=[];s.points=[];s.flash='Покупка удалена.';recordSnapshot();saveLocal();render();
  }
  function saveManualPrices(fd){
    const a=Number(fd.get('BTC')),b=Number(fd.get('ETH'));
    if(!(Number.isFinite(a)&&a>0&&Number.isFinite(b)&&b>0)){s.flash='Нужны корректные цены BTC и ETH.';render();return}
    const when=new Date().toISOString();
    s.quotes={BTC:{price:a,source:'Вручную',updated_at:when},ETH:{price:b,source:'Вручную',updated_at:when}};
    s.showPrices=false;s.sync=null;s.flash='Цены сохранены и PNL пересчитан.';recordSnapshot();saveLocal();render();
  }
  document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){s.tab=tab.dataset.tab;s.flash='';s.form=false;s.deleteId=null;render();return}const per=e.target.closest('[data-period]');if(per){s.period=per.dataset.period;render();await chart();return}const btn=e.target.closest('[data-action]');if(!btn||s.busy)return;const act=btn.dataset.action,id=Number(btn.dataset.id);if(act==='sync')return sync();if(act==='prices'){s.showPrices=!s.showPrices;render();return}if(act==='new')return formOpen();if(act==='edit')return formOpen(id);if(act==='delete'){s.deleteId=id;render();return}if(act==='cancelDelete'){s.deleteId=null;render();return}if(act==='confirmDelete')return removeTrade(id);if(act==='closeForm'){s.form=false;s.formError='';render()}});
  document.addEventListener('submit',e=>{if(e.target.id==='tradeForm'){e.preventDefault();saveTrade(new FormData(e.target))}if(e.target.id==='priceForm'){e.preventDefault();saveManualPrices(new FormData(e.target))}});
  document.addEventListener('change',e=>{if(e.target.id==='coin'&&s.editing===null){const input=$('entry');if(input)input.value=Number(s.quotes[e.target.value]?.price||initial[e.target.value])}});
  // Standalone web preview. Every edit is saved only in this browser, never to a public repository.
  loadLocal();render();chart();sync();
})();
</script>
</body>
</html>
