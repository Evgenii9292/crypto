<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafbfc" />
  <title>Мой портфель · fxmr4</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="wallet" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="16" rx="2"/><path d="M16 14h4M2 9h20M5 5V3h14"/></symbol>
    <symbol id="sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.4L3 9m0-6v6h6M4 13a8 8 0 0 0 14.7 4.4L21 15m0 6v-6h-6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="m16 4 4 4M3 21l4.5-1 12.6-12.6a2.7 2.7 0 0 0-3.8-3.8L3.8 16.3 3 21Z"/></symbol>
    <symbol id="x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6m4-6v6"/></symbol>
    <symbol id="layers" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8h10M7 12h10M7 16h7"/></symbol>
    <symbol id="activity" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="shield" viewBox="0 0 24 24"><path d="M12 2 4 5v7c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5L12 2Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 3h.01M16 12h.01M9 16h6"/></symbol>
  </svg>
  <main class="page"><div class="shell">
    <aside class="sidebar">
      <header class="header"><div class="logoArea"><div class="appicon"><svg class="icon"><use href="#wallet"/></svg></div><div><div class="appname">Мой портфель</div><div class="account">fxmr4 · Spot</div></div></div><span class="pill">USD</span></header>
      <div class="navLabel">РАЗДЕЛЫ</div>
      <nav class="tabs" data-active="overview" role="tablist" aria-label="Разделы портфеля">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="overview"><svg class="icon"><use href="#activity"/></svg><span>Обзор</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="positions"><svg class="icon"><use href="#wallet"/></svg><span>Spot</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="futures"><svg class="icon"><use href="#trend"/></svg><span>Futures</span></button>
      </nav>
      <div class="sideFooter"><span class="status-dot"></span>Котировки · раз в 60 секунд<div class="tiny">Операции сохраняются в браузере</div><button class="btn navConfig" type="button" data-action="goConnections">Подключения</button><div class="tiny"></div></div>
    </aside>
    <section class="workspace">
      <div class="workspaceHead"><div><div class="workspaceEyebrow">FXMR4 / Личный кабинет</div><h1 id="pageTitle">Обзор</h1></div><div class="headActions"><button class="btn" type="button" data-action="goConnections">Подключения</button><span class="pill">USD</span></div></div>
      <div id="pnlRibbon" class="pnlRibbon"></div>
      <div id="content" class="pane" role="tabpanel" aria-live="polite"><div class="skeleton">Загружаю портфель…</div></div>
      <div id="message" aria-live="polite"></div>
      <p class="tiny storageNote">Изменения сохраняются только в этом браузере. Синхронизация с аккаунтом Bybit потребует защищённого сервера.</p>
    </section>
  </div></main>
<script>
(() => {
  'use strict';
  const C=1000;
  const initial={BTC:76200,ETH:2247};
  const $=id=>document.getElementById(id);
  const el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));for(const c of children)n.append(c);return n};
  const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#${name}"></use></svg>`;
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dollars=(n,dec=2)=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const pct=(n)=>Number(n||0).toFixed(2)+'%';
  const signed=(n,type='money')=>(n<0?'−':'+')+(type==='money'?dollars(Math.abs(n)):pct(Math.abs(n)));
  const cls=n=>n>0.00001?'positive':n<-.00001?'negative':'neutral';
  const nowLocal=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const fmtDate=d=>{if(!d)return 'Нет даты';const a=d.slice(0,10).split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d};
  const fmtTime=d=>{if(!d)return '';const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  const s={tab:'overview',trades:[{id:1,coin:'BTC',spent:25,entry:76200,buy_date:'2026-11-06',confirmed:false},{id:2,coin:'ETH',spent:25,entry:2247,buy_date:'2026-11-06',confirmed:false}],quotes:{BTC:{price:initial.BTC,source:'Предварительно'},ETH:{price:initial.ETH,source:'Предварительно'}},capital:C,period:'7d',points:[],snapshots:[],sync:null,form:false,editing:null,deleteId:null,busy:false,flash:'',formError:'',showPrices:false,tradingSubtab:'futures',futureMode:'exchange',futureSort:'pnl',futureForm:null,futureFormError:'',sources:[{id:'bybit',name:'Bybit',connected:false,accounts:[]}],futuresPositions:[],openedExchanges:{},openedAccounts:{},spotHistoryOpen:false,spotOpen:{}};
  function coin(m){const trades=s.trades.filter(t=>t.coin===m);const invested=trades.reduce((t,x)=>t+Number(x.spent),0);const quantity=trades.reduce((t,x)=>t+Number(x.spent)/Number(x.entry),0);const current=Number(s.quotes[m]?.price||initial[m]);const value=quantity*current;return {invested,quantity,current,value,profit:value-invested,remaining:500-invested,avg:quantity?invested/quantity:0,provisional:trades.some(t=>!t.confirmed)}}
  function sums(){const btc=coin('BTC'),eth=coin('ETH'),invested=btc.invested+eth.invested,cash=C-invested,holdings=btc.value+eth.value,profit=holdings-invested;return {btc,eth,invested,cash,holdings,profit,total:cash+holdings}}

  function markStatus(){
    const q=s.quotes.BTC||{}, source=q.source||'Предварительно', fresh=source==='Bybit Spot'||source==='CoinGecko'||source==='CryptoCompare';
    const label=s.sync?.error?'Сеть недоступна · сохранённые цены':fresh?source+' · '+fmtTime(q.updated_at):source==='Вручную'?'Цены введены вручную':'Цены предварительные · уточни или обнови';
    return '<div class="status '+(s.sync?.error?'error':fresh?'ok':'stale')+'"><span class="dot"></span>'+escape(label)+'</div>';
  }
  function manualPricesHTML(){
    return '<form class="form" id="priceForm"><div class="formTitle">Изменить текущие курсы</div><div class="fieldrow"><div class="field"><label for="manualBTC">BTC, $</label><input id="manualBTC" name="BTC" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.BTC.price)+'" required></div><div class="field"><label for="manualETH">ETH, $</label><input id="manualETH" name="ETH" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.ETH.price)+'" required></div></div><button type="submit" class="btn primary full">Сохранить курсы</button></form>';
  }
  function overview(){const a=sums();const percent=a.invested?a.profit/a.invested*100:0;return `
    <div class="overview-layout"><div class="overview-primary">
    <div class="card tint"><div class="eyebrow">Стоимость портфеля</div><div class="total">${dollars(a.total)}</div><div class="performance"><span class="metric ${cls(a.profit)}">${signed(a.profit)} (${signed(percent,'pct')})</span><span class="tiny">от покупок</span></div><div class="hr"></div><div class="twocol"><div><div class="eyebrow">В монетах</div><div class="num">${dollars(a.holdings)}</div></div><div><div class="eyebrow">Свободно</div><div class="num">${dollars(a.cash)}</div></div></div></div>
    <section class="section pnlChart"><div class="hrow"><div class="sectitle">График PNL</div><div class="periods">${['24h','7d','30d','90d'].map(p=>`<button type="button" data-period="${p}" class="period ${s.period===p?'active':''}">${p}</button>`).join('')}</div></div><div class="chartbox" id="chartSlot">${chartHTML()}</div><div class="chartlegend"><span>Изменение прибыли с начала наблюдений</span><span>USD</span></div></section>
    </div><div class="overview-aside"><section class="section"><div class="hrow"><span class="sectitle">Распределение капитала</span><span class="tiny">Из $1 000</span></div><div class="bar"><span style="background:var(--btc);width:${a.total?Math.max(0,a.btc.value/a.total*100):0}%"></span><span style="background:var(--eth);width:${a.total?Math.max(0,a.eth.value/a.total*100):0}%"></span><span style="background:var(--reserve);flex:1"></span></div><div class="legend">${[['BTC',a.btc.value,'btc'],['ETH',a.eth.value,'eth'],['Резерв',a.cash,'reserve']].map(([n,v,c])=>`<div><div class="label"><i class="dot" style="background:var(--${c})"></i>${n}</div><strong>${pct(a.total?v/a.total*100:0)}</strong></div>`).join('')}</div></section>
    <section class="section sectionline"><div class="hrow"><span class="sectitle">Текущие цены</span><div class="flexend"><button type="button" class="btn" data-action="prices">Цены</button><button type="button" class="btn" data-action="sync" ${s.busy?'disabled':''}>${icon('sync',s.busy?'spin':'')} ${s.busy?'Обновляю':'Обновить'}</button></div></div>${[['BTC','Bitcoin','₿','btc'],['ETH','Ethereum','◆','eth']].map(([m,name,sym,color])=>`<div class="priceRow"><div class="coinleft"><div class="coinIcon ${color}">${sym}</div><div><div class="coinName">${m}</div><div class="coinSub">${name}</div></div></div><span class="price">${dollars(coin(m).current)}</span></div>`).join('')}${markStatus()}${s.showPrices?manualPricesHTML():''}</section></div></div>`}
  function chartHTML(){const d=s.points.filter(p=>typeof p.pnl==='number'&&Number.isFinite(p.pnl));if(d.length<2)return `<div class="emptychart">График появится после нескольких обновлений котировок. Историю до первого запуска не придумываем.</div>`;const vals=d.map(x=>x.pnl);let min=Math.min(...vals),max=Math.max(...vals);let span=Math.max(max-min,Math.max(1,Math.abs(max))*.08);min-=span*.13;max+=span*.13;const W=520,H=148,P=14;const xy=(v,i)=>[P+i*(W-2*P)/(vals.length-1),P+(max-v)/(max-min)*(H-2*P)];const pts=vals.map((v,i)=>xy(v,i).join(',')).join(' ');const y0=P+(max-0)/(max-min)*(H-2*P);const neg=vals.at(-1)<vals[0];const color=neg?'var(--red)':'var(--green)';const last=xy(vals.at(-1),vals.length-1);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="График прибыли за выбранный период"><path d="M${P} ${y0}H${W-P}" stroke="var(--border)" stroke-dasharray="4 5" fill="none"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="${color}"/></svg>`}
  function positions(){const a=sums();return `<div class="hrow"><div><div class="sectitle">Мои монеты</div><div class="tiny">2 актива · аккаунт fxmr4</div></div><button class="btn" data-action="new">${icon('plus')} Купить</button></div><div class="positionGrid">${[['BTC','Bitcoin','₿','btc',a.btc],['ETH','Ethereum','◆','eth',a.eth]].map(([m,name,sym,color,x])=>`<section class="card coinCard"><div class="top"><div class="coinleft"><div class="coinIcon ${color}">${sym}</div><div><div class="coinName">${name}</div><div class="coinSub">${m} · fxmr4</div></div></div><div class="right"><div class="bigValue">${dollars(x.value)}</div><div class="gain ${cls(x.profit)}">${signed(x.profit)} (${signed(x.invested?x.profit/x.invested*100:0,'pct')})</div></div></div><div class="minirow"><div><div class="dataLabel">Вложено</div><div class="dataValue">${dollars(x.invested)}</div></div><div><div class="dataLabel">Доля портфеля</div><div class="dataValue">${pct(a.total?x.value/a.total*100:0)}</div></div><div><div class="dataLabel">Средняя покупка</div><div class="dataValue">${x.avg?dollars(x.avg):'—'}</div></div><div><div class="dataLabel">Цена сейчас</div><div class="dataValue">${dollars(x.current)}</div></div></div><div class="limit"><div class="note"><span>Лимит $500</span><span>${dollars(x.remaining)} осталось</span></div><div class="bar"><span style="background:var(--${color});width:${Math.max(0,x.invested/500*100)}%"></span></div></div>${x.provisional?'<div class="warning">Есть покупки с неподтверждённой датой или ценой входа.</div>':''}</section>`).join('')}</div>`}
  function history(){const trades=[...s.trades].sort((a,b)=>b.buy_date.localeCompare(a.buy_date)||b.id-a.id);return `<div class="hrow"><div class="sectitle">История покупок</div><button class="btn primary" data-action="new">${icon('plus')} Добавить</button></div>${trades.length?trades.map(t=>`<section class="card tradecard"><div class="hrow"><div><div class="coinName">${t.coin} · Покупка</div><div class="date">${fmtDate(t.buy_date)}${!t.confirmed?' · предварительно':''}</div></div><div class="right"><div class="price">${dollars(t.spent)}</div><div class="date">По ${dollars(t.entry)}</div></div></div><div class="action"><button class="btn" data-action="edit" data-id="${t.id}">${icon('edit')} Изменить</button><button class="btn danger" data-action="delete" data-id="${t.id}">${icon('trash')} Удалить</button></div>${s.deleteId===t.id?`<div class="confirmation"><div class="confirmText">Удалить эту покупку? Действие нельзя отменить.</div><div class="flexend"><button class="btn" data-action="cancelDelete">Отмена</button><button class="btn danger" data-action="confirmDelete" data-id="${t.id}">Удалить</button></div></div>`:''}</section>`).join(''):'<div class="warning">Покупок пока нет.</div>'}${s.form?formHTML():''}<div class="warning">Начальные покупки по $25 имеют предварительную дату и цену входа. Уточни фактические данные через «Изменить», иначе PNL будет приблизительным.</div>`}
  function formHTML(){const edit=s.trades.find(t=>t.id===s.editing);const o=edit||{coin:'BTC',spent:25,entry:s.quotes.BTC.price,buy_date:nowLocal()};return `<form id="tradeForm" class="form"><div class="hrow"><div class="formTitle">${edit?'Изменить покупку':'Новая покупка'}</div><button class="btn ghost" type="button" data-action="closeForm" aria-label="Закрыть">${icon('x')}</button></div><div class="field"><label for="coin">Монета</label><select id="coin" name="coin"><option ${o.coin==='BTC'?'selected':''} value="BTC">Bitcoin · BTC</option><option ${o.coin==='ETH'?'selected':''} value="ETH">Ethereum · ETH</option></select></div><div class="field"><label for="date">Дата покупки</label><input id="date" name="buy_date" type="date" max="${nowLocal()}" value="${escape(o.buy_date)}" required/></div><div class="fieldrow"><div class="field"><label for="spent">Сумма, $</label><input id="spent" name="spent" type="number" inputmode="decimal" min="0.01" max="500" step="any" value="${Number(o.spent)}" required/></div><div class="field"><label for="entry">Цена покупки, $</label><input id="entry" name="entry" type="number" inputmode="decimal" min="0.0000001" step="any" value="${Number(o.entry)}" required/></div></div>${s.formError?`<div class="errorText">${escape(s.formError)}</div>`:''}<button type="submit" class="btn full primary" ${s.busy?'disabled':''}>${s.busy?'Сохраняю…':'Сохранить покупку'}</button></form>`}

  function trading(){
    const future=s.tradingSubtab==='futures';
    const metrics=future?[['Открытые позиции','—'],['Плавающий PNL','—'],['Маржа','—'],['Реализованный PNL','—']]:[['Активные боты','—'],['Средства в ботах','—'],['PNL ботов','—'],['Закрытые циклы','—']];
    return `<div class="hrow"><div><div class="sectitle">Торговля</div><div class="tiny">Bybit · фьючерсы и торговые боты</div></div><span class="pill">Не подключено</span></div>
      <div class="tradeSwitch" role="tablist" aria-label="Тип торговли"><button type="button" data-trade-sub="futures" class="${future?'active':''}">Фьючерсы</button><button type="button" data-trade-sub="bots" class="${!future?'active':''}">Боты</button></div>
      <div class="tradeMetrics">${metrics.map(([label,value])=>`<div class="card tint"><div class="eyebrow">${label}</div><div class="num">${value}</div></div>`).join('')}</div>
      <div class="card emptyState"><div class="emptyIcon">${icon(future?'trend':'bot')}</div><div class="sectitle">${future?'Открытые фьючерсные позиции':'Торговые боты'}</div>
      <p>${future?'После подключения Bybit здесь появятся реальные позиции, LONG/SHORT, плечо, вход, ликвидация и PNL.':'Здесь будут боты, вложения, доходность и текущий статус. Veles подключим отдельным этапом.'}</p>
      <button class="btn primary" type="button" data-action="goConnections">Как подключить Bybit</button></div>
      <div class="warning">Пустые значения означают отсутствие подключения, а не нулевой баланс. Это информационный экран: ордера не отправляются.</div>`;
  }
  function connections(){
    return `<div class="hrow"><div><div class="sectitle">Подключения</div><div class="tiny">Источники данных портфеля</div></div><span class="pill">Только чтение</span></div>
      <div class="card connectorCard"><div class="hrow"><div class="logoArea"><div class="appicon">${icon('shield')}</div><div><div class="coinName">Bybit</div><div class="coinSub">Аккаунт fxmr4 · не подключён</div></div></div><span class="connectBadge">Не подключено</span></div>
      <p class="connectCopy">Сейчас приложение получает только публичные курсы BTC/ETH. Приватные балансы, покупки и фьючерсы с биржи ещё не загружаются.</p>
      <div class="safeNote">API Secret нельзя вставлять в публичный сайт, исходный код или GitHub. Для подключения нужен защищённый сервер, который хранит ключ и передаёт браузеру только данные о позициях.</div>
      <div class="connectSteps"><div><span>01</span>Создать в Bybit отдельный API-ключ только для чтения</div><div><span>02</span>Ограничить доступ IP-адресом своего сервера</div><div><span>03</span>Подключить серверное API и проверить остатки и позиции</div></div>
      <a class="btn primary externalLink" href="https://www.bybit.com/app/user/api-management" target="_blank" rel="noopener noreferrer">Управление API в Bybit ↗</a></div>
      <div class="warning">Форма подключения появится после создания защищённой серверной части. Сейчас API-ключи здесь не принимаются.</div>`;
  }
  function render(){
    const view=s.tab==='overview'?overview():s.tab==='positions'?positions():s.tab==='history'?history():s.tab==='trading'?trading():connections();
    $('content').innerHTML=view;$('content').classList.remove('pane');void $('content').offsetWidth;$('content').classList.add('pane');
    const titles={overview:'Обзор',positions:'Спот',history:'Покупки',trading:'Торговля',connections:'Bybit'};
    $('pageTitle').textContent=titles[s.tab];
    const ribbon=$('pnlRibbon'),a=sums();
    ribbon.style.display=s.tab==='overview'?'none':'flex';
    ribbon.innerHTML='<span class="tiny">Спотовый PNL · fxmr4</span><strong class="'+cls(a.profit)+'">'+signed(a.profit)+' ('+signed(a.invested?a.profit/a.invested*100:0,'pct')+')</strong>';
    document.querySelector('.tabs').dataset.active=s.tab;
    document.querySelectorAll('[data-tab]').forEach(b=>{const is=b.dataset.tab===s.tab;b.classList.toggle('active',is);b.setAttribute('aria-selected',is?'true':'false')});
    $('message').innerHTML=s.flash?`<div class="toast">${escape(s.flash)}</div>`:'';
  }

  const storageKey='fxmr4_portfolio_public_preview_v1';
  function loadLocal(){
    try{
      const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
      if(!saved||typeof saved!=='object')return;
      if(Array.isArray(saved.trades))s.trades=saved.trades.filter(t=>['BTC','ETH'].includes(t.coin)&&Number(t.spent)>0&&Number(t.entry)>0&&typeof t.buy_date==='string');
      for(const coin of ['BTC','ETH']){
        const q=saved.quotes?.[coin];
        if(q&&Number(q.price)>0&&Number.isFinite(Number(q.price)))s.quotes[coin]={price:Number(q.price),source:String(q.source||'Сохранено'),updated_at:q.updated_at||null};
      }
      if(Array.isArray(saved.snapshots))s.snapshots=saved.snapshots.filter(p=>Number.isFinite(p.time)&&Number.isFinite(p.pnl)).slice(-1500);
    }catch(e){console.warn('Локальное сохранение:',e)}
  }
  function saveLocal(){
    try{localStorage.setItem(storageKey,JSON.stringify({trades:s.trades,quotes:s.quotes,snapshots:s.snapshots}))}catch(e){s.flash='Не удалось сохранить в браузере. Проверь режим приватности.';console.warn(e)}
  }
  function chart(){
    const windows={'24h':86400000,'7d':604800000,'30d':2592000000,'90d':7776000000};
    const from=Date.now()-(windows[s.period]||604800000);
    s.points=s.snapshots.filter(p=>p.time>=from);
    if(s.tab==='overview'&&!s.showPrices&&!s.form)render();
  }
  function recordSnapshot(){
    const p={time:Date.now(),pnl:sums().profit};
    const last=s.snapshots[s.snapshots.length-1];
    if(last&&p.time-last.time<1500&&Math.abs(last.pnl-p.pnl)<0.000001)return;
    s.snapshots.push(p);s.snapshots=s.snapshots.slice(-1500);saveLocal();chart();
  }
  async function json(url){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),6500);
    try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal,headers:{'Accept':'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}
  }
  async function bybitQuotes(){
    const px=await Promise.all(['BTC','ETH'].map(async m=>{
      const x=await json('https://api.bybit.com/v5/market/tickers?category=spot&symbol='+m+'USDT');
      const val=Number(x?.result?.list?.[0]?.lastPrice);
      if(x?.retCode!==0||!Number.isFinite(val)||val<=0)throw Error('Bybit returned invalid quote');
      return val;
    }));
    return {BTC:px[0],ETH:px[1],source:'Bybit Spot'};
  }
  async function coingeckoQuotes(){
    const r=await json('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin%2Cethereum&vs_currencies=usd');
    const a=Number(r?.bitcoin?.usd),b=Number(r?.ethereum?.usd);
    if(!(a>0&&b>0))throw Error('CoinGecko returned invalid quote');
    return {BTC:a,ETH:b,source:'CoinGecko'};
  }
  async function cryptocompareQuotes(){
    const r=await json('https://min-api.cryptocompare.com/data/pricemulti?fsyms=BTC%2CETH&tsyms=USD');
    const a=Number(r?.BTC?.USD),b=Number(r?.ETH?.USD);
    if(!(a>0&&b>0))throw Error('CryptoCompare returned invalid quote');
    return {BTC:a,ETH:b,source:'CryptoCompare'};
  }
  let lastSyncAttempt=0;
  async function sync(opts={}){
    const quiet=!!opts.quiet;
    if(s.busy)return;
    lastSyncAttempt=Date.now();s.busy=true;s.sync=null;
    if(!quiet&&!s.form&&!s.showPrices)render();
    let success=false;
    for(const provider of [bybitQuotes,coingeckoQuotes,cryptocompareQuotes]){
      try{
        const q=await provider(),when=new Date().toISOString();
        s.quotes={BTC:{price:q.BTC,source:q.source,updated_at:when},ETH:{price:q.ETH,source:q.source,updated_at:when}};
        s.sync={source:q.source};
        if(!quiet)s.flash='Цены обновлены: '+q.source+'.';
        recordSnapshot();success=true;break;
      }catch(e){console.warn('Источник цен недоступен:',e.message)}
    }
    if(!success){s.sync={error:true};if(!quiet)s.flash='Источники цен недоступны. Используются сохранённые курсы.'}
    s.busy=false;
    if(!s.form&&!s.showPrices)render();
  }
  function flash(msg){s.flash=msg;render()}
  function formOpen(id=null){s.tab='history';s.form=true;s.editing=id;s.deleteId=null;s.formError='';s.flash='';render();$('tradeForm')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
  function saveTrade(fd){
    const coin=fd.get('coin'),spent=Number(fd.get('spent')),entry=Number(fd.get('entry')),buy_date=fd.get('buy_date');
    if(!['BTC','ETH'].includes(coin)||!Number.isFinite(spent)||!Number.isFinite(entry)||spent<=0||entry<=0){s.formError='Проверь сумму и цену покупки.';render();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(buy_date)||buy_date>nowLocal()){s.formError='Проверь дату покупки.';render();return}
    const base=s.trades.filter(t=>t.id!==s.editing);
    if(base.filter(t=>t.coin===coin).reduce((a,t)=>a+Number(t.spent),0)+spent>500.0000001){s.formError='Лимит для '+coin+' составляет $500.';render();return}
    if(base.reduce((a,t)=>a+Number(t.spent),0)+spent>C+0.0000001){s.formError='Превышен общий бюджет $1 000.';render();return}
    const id=s.editing===null?Math.max(0,...s.trades.map(t=>Number(t.id)))+1:s.editing;
    const rec={id,coin,spent,entry,buy_date,confirmed:true};
    s.trades=s.editing===null?[...s.trades,rec]:s.trades.map(t=>t.id===id?rec:t);
    s.snapshots=[];s.points=[];s.form=false;s.editing=null;s.formError='';s.flash='Покупка сохранена. История PNL начнётся заново после изменения позиции.';recordSnapshot();saveLocal();render();
  }
  function removeTrade(id){
    s.trades=s.trades.filter(t=>t.id!==id);s.deleteId=null;s.snapshots=[];s.points=[];s.flash='Покупка удалена.';recordSnapshot();saveLocal();render();
  }
  function saveManualPrices(fd){
    const a=Number(fd.get('BTC')),b=Number(fd.get('ETH'));
    if(!(Number.isFinite(a)&&a>0&&Number.isFinite(b)&&b>0)){s.flash='Нужны корректные цены BTC и ETH.';render();return}
    const when=new Date().toISOString();
    s.quotes={BTC:{price:a,source:'Вручную',updated_at:when},ETH:{price:b,source:'Вручную',updated_at:when}};
    s.showPrices=false;s.sync=null;s.flash='Цены сохранены и PNL пересчитан.';recordSnapshot();saveLocal();render();
  }
  document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){s.tab=tab.dataset.tab;s.flash='';s.form=false;s.deleteId=null;render();return}const sub=e.target.closest('[data-trade-sub]');if(sub){s.tradingSubtab=sub.dataset.tradeSub;render();return}const per=e.target.closest('[data-period]');if(per){s.period=per.dataset.period;render();await chart();return}const btn=e.target.closest('[data-action]');if(!btn||s.busy)return;const act=btn.dataset.action,id=Number(btn.dataset.id);if(act==='sync')return sync();if(act==='goConnections'){s.tab='connections';s.flash='';render();return}if(act==='prices'){s.showPrices=!s.showPrices;render();return}if(act==='new')return formOpen();if(act==='edit')return formOpen(id);if(act==='delete'){s.deleteId=id;render();return}if(act==='cancelDelete'){s.deleteId=null;render();return}if(act==='confirmDelete')return removeTrade(id);if(act==='closeForm'){s.form=false;s.formError='';render()}});
  document.addEventListener('submit',e=>{if(e.target.id==='tradeForm'){e.preventDefault();saveTrade(new FormData(e.target))}if(e.target.id==='priceForm'){e.preventDefault();saveManualPrices(new FormData(e.target))}});
  document.addEventListener('change',e=>{if(e.target.id==='coin'&&s.editing===null){const input=$('entry');if(input)input.value=Number(s.quotes[e.target.value]?.price||initial[e.target.value])}});
  // Standalone web preview. Every edit is saved only in this browser, never to a public repository.
  loadLocal();render();chart();sync({quiet:true});
  setInterval(()=>{if(!document.hidden&&!s.busy)sync({quiet:true})},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastSyncAttempt>60000)sync({quiet:true})});
})();
</script>
</body>
</html>
