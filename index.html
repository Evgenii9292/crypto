<script>
(() => {
  'use strict';
  let C=1000;
  const initial={BTC:76200,ETH:2247};
  const $=id=>document.getElementById(id);
 const themeKey='fxmr4_theme_v1';
 function currentTheme(){
  const choice=document.documentElement?.dataset?.theme;
  return choice==='light'||choice==='dark'?choice:(window.matchMedia?.('(prefers-color-scheme: dark)')?.matches?'dark':'light');
 }
 function syncThemeButtons(){
  const dark=currentTheme()==='dark';
  for(const b of document.querySelectorAll('[data-action="toggleTheme"]')){
   b.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');
   b.setAttribute('title',dark?'Светлая тема':'Тёмная тема');
   b.setAttribute('aria-pressed',dark?'true':'false');
   const use=b.querySelector?.('use');
   if(use)use.setAttribute('href',dark?'#sun':'#moon');
  }
 }
 function setTheme(choice){
  if(choice!=='light'&&choice!=='dark')return;
  if(document.documentElement?.dataset)document.documentElement.dataset.theme=choice;
  try{localStorage.setItem(themeKey,choice)}catch(e){}
  syncThemeButtons();
 }

  const el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));for(const c of children)n.append(c);return n};
  const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#${name}"></use></svg>`;
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dollars=(n,dec=2)=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const pct=(n)=>Number(n||0).toFixed(2)+'%';
  const signed=(n,type='money')=>(n<0?'−':'+')+(type==='money'?dollars(Math.abs(n)):pct(Math.abs(n)));
  const cls=n=>n>0.00001?'positive':n<-.00001?'negative':'neutral';
  const nowLocal=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const fmtDate=d=>{if(!d)return 'Нет даты';const a=d.slice(0,10).split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d};
  const fmtTime=d=>{if(!d)return '';const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  const s={tab:'overview',trades:[{id:1,coin:'BTC',spent:25,entry:76200,buy_date:'2026-11-06',confirmed:false},{id:2,coin:'ETH',spent:25,entry:2247,buy_date:'2026-11-06',confirmed:false}],quotes:{BTC:{price:initial.BTC,source:'Предварительно'},ETH:{price:initial.ETH,source:'Предварительно'}},capital:C,period:'7d',chartPeriod:{overview:'all',spot:'all',futures:'30d'},chartMetric:{spot:'pnl',futures:'realized30d'},points:[],snapshots:[],sync:null,form:false,editing:null,deleteId:null,busy:false,flash:'',formError:'',showPrices:false,tradingSubtab:'futures',futureMode:'all',futureSort:'pnl',futureSortDir:-1,pnlMode:'all',capitalOpen:false,portfolioSnapshots:[],pnlHistory:[],pendingRemove:null,renameId:null,renameValue:'',renameError:'',futureForm:null,futureFormError:'',sources:[{id:'bybit',name:'Bybit',connected:false,accounts:[]}],futuresPositions:[],openedExchanges:{},openedAccounts:{},spotHistoryOpen:false,spotAccountsOpen:false,spotOpen:{},bybitSnapshot:null,bybitAccountsSnapshots:{},monthlyPerformance:{},monthlyLoading:{},monthlyAnchorMs:null,periodReports:{},periodLoading:{},periodProgress:{},periodChunkCache:{},monthlyErrors:{},periodErrors:{},periodErrorRetryAt:{},completeReportSnapshots:{},spotHistoricalReports:{},spotHistoryLoading:{},equityHistory:[],equityHistoryAt:0,equityHistoryLoading:false,futuresView:'pnl',futuresValueMode:'usd',futuresAccountFilter:'all',bybitExpectedIds:[],backendConnection:{available:false,configured:false,connected:false,error:''}};
  function coin(m){const trades=s.trades.filter(t=>t.coin===m);const invested=trades.reduce((t,x)=>t+Number(x.spent),0);const quantity=trades.reduce((t,x)=>t+Number(x.spent)/Number(x.entry),0);const current=Number(s.quotes[m]?.price||initial[m]);const value=quantity*current;return {invested,quantity,current,value,profit:value-invested,remaining:C/2-invested,avg:quantity?invested/quantity:0,provisional:trades.some(t=>!t.confirmed)}}
  function sums(){const btc=coin('BTC'),eth=coin('ETH'),invested=btc.invested+eth.invested,cash=C-invested,holdings=btc.value+eth.value,profit=holdings-invested;return {btc,eth,invested,cash,holdings,profit,total:cash+holdings}}

  function markStatus(){
    const q=s.quotes.BTC||{}, source=q.source||'Предварительно', fresh=source.startsWith('Bybit Spot')||source==='CoinGecko'||source==='CryptoCompare';
    const label=s.sync?.error?'Сеть недоступна · сохранённые цены':fresh?source+' · '+fmtTime(q.updated_at):source==='Вручную'?'Цены введены вручную':'Цены предварительные · уточни или обнови';
    return '<div class="status '+(s.sync?.error?'error':fresh?'ok':'stale')+'"><span class="dot"></span>'+escape(label)+'</div>';
  }
  function manualPricesHTML(){
    return '<form class="form" id="priceForm"><div class="formTitle">Изменить текущие курсы</div><div class="fieldrow"><div class="field"><label for="manualBTC">BTC, $</label><input id="manualBTC" name="BTC" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.BTC.price)+'" required></div><div class="field"><label for="manualETH">ETH, $</label><input id="manualETH" name="ETH" type="number" inputmode="decimal" step="any" min="0.01" value="'+Number(s.quotes.ETH.price)+'" required></div></div><button type="submit" class="btn primary full">Сохранить курсы</button></form>';
  }
function axisMoney(n){return (n<0?'−':n>0?'+':'')+'$'+(Math.abs(n)<10?Math.abs(n).toFixed(2):Math.abs(n)<100?Math.abs(n).toFixed(1):Math.round(Math.abs(n)).toLocaleString('en-US'))}
function portfolioSummary(){
 const a=sums(),snap=s.bybitSnapshot,fresh=!!s.backendConnection.connected;
 const positions=s.futuresPositions.filter(p=>p.exchangeId==='bybit');
 const known=!!snap&&fresh&&positions.every(p=>p.initialMargin!=null&&Number.isFinite(Number(p.initialMargin)));
 const margin=known?positions.reduce((v,p)=>v+Number(p.initialMargin),0):null;
 const futuresFloatingPnl=snap&&fresh&&snap.totals?.perpUPL!=null&&Number.isFinite(Number(snap.totals.perpUPL))?Number(snap.totals.perpUPL):null;
  const futuresRealisedPnl=snap&&fresh&&snap.totals?.realisedPnl!=null&&Number.isFinite(Number(snap.totals.realisedPnl))?Number(snap.totals.realisedPnl):null;
  const futuresPnl=snap&&fresh&&snap.totals?.accountPnl!=null&&Number.isFinite(Number(snap.totals.accountPnl))?Number(snap.totals.accountPnl):null;
 const pnl=futuresPnl!=null?a.profit+futuresPnl:hasTrackedFutures()?null:a.profit;
 return {spot:a,hasFutures:!!snap,margin,invested:!snap?a.invested:margin===null?null:a.invested+margin,
  futuresPnl,futuresFloatingPnl,futuresRealisedPnl,pnl};
}
const PERIODS={'60d':5184000000,'24h':86400000,'7d':604800000,'30d':2592000000,'90d':7776000000,'6m':15552000000,'1y':31536000000,'all':Infinity};
const PERIOD_NAMES={'24h':'24 часа','7d':'7 дней','30d':'30 дней','60d':'60 дней','90d':'90 дней','6m':'180 дней','1y':'1 год','all':'всё время'};
function pnlField(kind){return kind==='spot'?'spot':kind==='futures'?'futures':'total'}
function hasTrackedFutures(){
 const known=p=>p&&(p.futures!=null||p.futuresAccount!=null);
 return !!(s.backendConnection.configured||s.bybitSnapshot||s.portfolioSnapshots.some(known)||(s.pnlHistory||[]).some(known));
}
function pnlSeries(kind,metric='pnl'){
 kind=kind||s.pnlMode;
 const field=pnlField(kind);
 const n=x=>x!=null&&Number.isFinite(Number(x))?Number(x):null;
 function value(p){
  if(kind==='spot')return n(p.spot??p.pnl);
  if(kind==='futures')return n(metric==='floating'?p.futures:p.futuresAccount);
  const spot=n(p.spot),futures=n(p.futuresAccount);
  if(spot!==null&&futures!==null)return spot+futures;
  if(hasTrackedFutures())return null;
  return spot;
 }
 const live=kind==='spot'
  ?s.snapshots.map(p=>({t:Number(p.time),v:Number(p.pnl)}))
  :s.portfolioSnapshots.map(p=>({t:Number(p.time),v:value(p)}));
 const server=(s.pnlHistory||[]).map(p=>({t:Number(p.t),v:value(p)}));
 const byTime=new Map();
 for(const p of server.concat(live)){
  if(Number.isFinite(p.t)&&p.v!==null&&Number.isFinite(p.v))byTime.set(p.t,p);
 }
 return {kind,field,points:Array.from(byTime.values()).sort((a,b)=>a.t-b.t)};
}

function monthlyFutures(){
 const ids=s.bybitExpectedIds||[];
 if(!ids.length)return null;
 const parts=ids.map(id=>s.monthlyPerformance[id]);
 if(parts.some(p=>!p||!Number.isFinite(p.netPnl)))return null;
 if(parts.some(p=>p.from!==parts[0].from||p.to!==parts[0].to))return null;
 const totals={netPnl:0,tradingPnl:0,funding:0,fees:0,from:Infinity,to:0,days:[]};
 const days=new Map();
 for(const p of parts){
  for(const k of ['netPnl','tradingPnl','funding','fees'])totals[k]+=p[k]||0;
  totals.from=Math.min(totals.from,p.from);totals.to=Math.max(totals.to,p.to);
  for(const d of p.days||[])days.set(d.date,(days.get(d.date)||0)+Number(d.netPnl||0));
 }
 totals.days=Array.from(days,([date,netPnl])=>({date,netPnl})).sort((a,b)=>a.date.localeCompare(b.date));
 return totals;
}
function monthlyFuturesSeries(){
 const p=monthlyFutures();
 if(!p)return [];
 let running=0;
 const points=[{t:p.from,v:0}];
 for(const d of p.days){
  const t=Math.min(p.to,Date.parse(d.date+'T23:59:59.999Z'));
  if(!Number.isFinite(t)||t<=p.from)continue;
  running+=d.netPnl;
  points.push({t,v:running});
 }
 points.push({t:p.to,v:p.netPnl});
 return points.sort((a,b)=>a.t-b.t);
}


function activeFuturesReports(period,accountId='all'){
 const ids=accountId==='all'?(s.bybitExpectedIds||[]):[accountId];
 if(accountId!=='all'&&!s.bybitExpectedIds.includes(accountId))return null;
 if(!ids.length)return null;
 const current=ids.map(id=>period==='30d'?s.monthlyPerformance[id]:s.periodReports[period]?.[id]);
 const valid=parts=>parts.every(p=>p&&Number.isFinite(p.netPnl)&&Array.isArray(p.points))&&
  parts.every(p=>p.from===parts[0].from&&p.to===parts[0].to);
 const key=period+'|'+ids.join('|');
 if(valid(current)){
  s.completeReportSnapshots[key]=current.slice();
  return current;
 }
 // Retain the previous complete interval while one of several accounts
 // refreshes. Never connect incompatible reporting anchors into a fake chart.
 const stable=s.completeReportSnapshots[key];
 return stable&&valid(stable)?stable:null;
}
function futuresLedgerData(period,accountId='all'){
 const reports=activeFuturesReports(period,accountId);
 if(!reports)return null;
 const bins=new Map(),first=reports[0].from,last=reports[0].to;
 const bySymbol=new Map(),byDay=new Map();
 let net=0,funding=0,fees=0;
 for(const report of reports){
  net+=Number(report.netPnl);
  funding+=Number(report.funding)||0;
  fees+=Number(report.fees)||0;
  for(const symbol of report.symbols||[]){
   const name=String(symbol.symbol||'OTHER');
   const row=bySymbol.get(name)||{symbol:name,netPnl:0,operations:0};
   row.netPnl+=Number(symbol.netPnl)||0;
   row.operations+=Number(symbol.operations)||0;
   bySymbol.set(name,row);
  }
  for(const day of report.days||[]){
   const date=String(day.date||'');
   if(/^\d{4}-\d{2}-\d{2}$/.test(date))
    byDay.set(date,(byDay.get(date)||0)+(Number(day.netPnl)||0));
  }
  for(const point of report.points){
   const t=Number(point.t),v=Number(point.netPnl);
   if(!Number.isFinite(t)||!Number.isFinite(v)||t<first||t>=last)continue;
   bins.set(t,(bins.get(t)||0)+v);
  }
 }
 const series=[{t:first,v:0}];
 let running=0;
 for(const [t,v] of [...bins].sort((a,b)=>a[0]-b[0])){
  running+=v;
  if(t===first)series.push({t:first+1,v:running});
  else series.push({t,v:running});
 }
 // The summary is authoritative; make the last point agree with the displayed
 // amount even if fractional cents were rounded inside time buckets.
 series.push({t:last,v:net});
 return {netPnl:net,funding,fees,from:first,to:last,points:series,
  buckets:[...bins].sort((a,b)=>a[0]-b[0]).map(([t,netPnl])=>({t,netPnl})),
  days:[...byDay].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,netPnl])=>({date,netPnl})),
  symbols:[...bySymbol.values()].sort((a,b)=>Math.abs(b.netPnl)-Math.abs(a.netPnl))};
}
function futuresPeriodError(period){
 const ids=s.bybitExpectedIds||[];
 return s.periodErrors[period]||ids.map(id=>period==='30d'?
  s.monthlyErrors[id]:s.periodReports[period]?.[id]?.error).find(Boolean);
}

async function loadEquityHistory(){
 if(!s.backendConnection.available||s.equityHistoryLoading||
     Date.now()-s.equityHistoryAt<600000)return;
 s.equityHistoryLoading=true;
 try{
  const r=await fetch('./api/equity-history',{cache:'no-store',credentials:'same-origin'});
  const result=await r.json();
  if(r.ok&&Array.isArray(result.points)){
   s.equityHistory=result.points.filter(p=>p&&Number.isFinite(Number(p.t))&&
    Number.isFinite(Number(p.equity))&&Number(p.equity)>=0&&p.accountId);
   s.equityHistoryAt=Date.now();
   if(s.tab==='futures')renderLive();
  }
 }catch(e){/* No fabricated equity values during API failure. */}
 finally{s.equityHistoryLoading=false}
}
function observedEquitySeries(period,accountId='all'){
 const ids=accountId==='all'?(s.bybitExpectedIds||[]):[accountId];
 if(accountId!=='all'&&!s.bybitExpectedIds.includes(accountId))return [];
 if(!ids.length)return [];
 const interval=300000,byBucket=new Map();
 for(const p of s.equityHistory){
  if(!ids.includes(p.accountId))continue;
  const t=Math.floor((Number(p.t)+interval/2)/interval)*interval;
  const bucket=byBucket.get(t)||new Map();
  bucket.set(p.accountId,Number(p.equity));
  byBucket.set(t,bucket);
 }
 const from=Date.now()-(PERIODS[period]===Infinity?3650*86400000:(PERIODS[period]||2592000000));
 return [...byBucket].filter(([t,accounts])=>t>=from&&ids.every(id=>accounts.has(id)))
   .sort((a,b)=>a[0]-b[0])
   .map(([t,accounts])=>({t,v:ids.reduce((n,id)=>n+accounts.get(id),0)}));
}
function futuresValue(n,unit='usd',accountId='all'){
 if(n==null||!Number.isFinite(Number(n)))return '—';
 if(unit!=='pct')return signed(Number(n));
 const equity=accountId==='all'?Number(s.bybitSnapshot?.totals?.equity):Number(s.bybitAccountsSnapshots[accountId]?.totals?.equity);
 return Number.isFinite(equity)&&equity>0?signed(Number(n)/equity*100,'pct'):'—';
}

function combineBybitChunks(chunks,from,to,period){
 if(!chunks.length)return null;
 const sorted=[...chunks].sort((a,b)=>a.from-b.from);
 let current=from;
 const totals={netPnl:0,tradingPnl:0,funding:0,fees:0};
 const points=new Map(),days=new Map(),symbols=new Map();
 for(const part of sorted){
  if(part.from!==current||part.to<=current||part.to>to||
     !Number.isFinite(part.netPnl)||!Array.isArray(part.points)){
   throw Error('В истории Bybit есть пропущенный период');
  }
  current=part.to;
  for(const key of Object.keys(totals))totals[key]+=Number(part[key])||0;
  for(const x of part.points){
   if(!Number.isFinite(x.t)||!Number.isFinite(x.netPnl)||
      x.t<part.from||x.t>=part.to)throw Error('Повреждён фрагмент истории Bybit');
   points.set(x.t,(points.get(x.t)||0)+x.netPnl);
  }
  for(const d of part.days||[]){
   if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d.date)))continue;
   const value=days.get(d.date)||{date:d.date,netPnl:0,funding:0,fees:0};
   for(const key of ['netPnl','funding','fees'])value[key]+=Number(d[key])||0;
   days.set(d.date,value);
  }
  for(const record of part.symbols||[]){
   const name=String(record.symbol||'OTHER');
   const value=symbols.get(name)||{symbol:name,netPnl:0,operations:0};
   value.netPnl+=Number(record.netPnl)||0;
   value.operations+=Number(record.operations)||0;
   symbols.set(name,value);
  }
 }
 if(current!==to)throw Error('Bybit вернул неполную историю');
 return {...totals,from,to,period,
  points:[...points].sort((a,b)=>a[0]-b[0]).map(([t,netPnl])=>({t,netPnl})),
  days:[...days.values()].sort((a,b)=>a.date.localeCompare(b.date)),
  symbols:[...symbols.values()].sort((a,b)=>Math.abs(b.netPnl)-Math.abs(a.netPnl))};
}
async function fetchLongBybitPeriod(accountId,period,anchor){
 const duration=period==='all'?729*86400000:PERIODS[period];
 if(!Number.isFinite(duration)||duration<=0)throw Error('Неизвестный период');
 const from=anchor-duration,interval=6*86400000,windows=[];
 // UTC epoch-aligned six-day boundaries are stable across calendar days.
 // Only the rolling first fragment and the recent tail may need refreshing.
 for(let t=from;t<anchor;){
  const boundary=(Math.floor(t/interval)+1)*interval;
  const stop=Math.min(anchor,boundary);
  windows.push([t,stop]);t=stop;
 }
 const results=new Array(windows.length);
 const progress=s.periodProgress[period]||{done:0,total:windows.length};
 s.periodProgress[period]=progress;
 // Keep each HTTP request below the reverse proxy timeout, use only two
 // concurrent transactions per account to respect Bybit's rate limits.
 let next=0;
 async function worker(){
  while(next<windows.length){
   const i=next++, [start,stop]=windows[i];
   const cacheKey=accountId+':'+start+':'+stop;
   const cached=s.periodChunkCache[cacheKey];
   const immutable=stop<=Date.now()-2*86400000;
   const fresh=immutable||cached&&Date.now()-cached.receivedAt<600000;
   if(cached&&fresh){
    results[i]=cached.data;
   }else{
    const u='./api/period-chunk?id='+encodeURIComponent(accountId)+
      '&startAt='+start+'&endAt='+stop;
    let data=null;
    for(let attempt=0;attempt<3;attempt++){
     try{
      const response=await fetch(u,{cache:'no-store',credentials:'same-origin'});
      const value=await response.json();
      if(!response.ok)throw Error(value.error||'Bybit API недоступен');
      if(value.from!==start||value.to!==stop)throw Error('Период ответа Bybit не совпал с запросом');
      data=value;break;
     }catch(e){
      if(attempt===2)throw e;
      await new Promise(resolve=>setTimeout(resolve,750*(attempt+1)));
     }
    }
    results[i]=data;
    s.periodChunkCache[cacheKey]={data,receivedAt:Date.now()};
    if(progress.done%3===2)persistBybitHistory();
    const keys=Object.keys(s.periodChunkCache);
    if(keys.length>1500){
     for(const key of keys.slice(0,300))delete s.periodChunkCache[key];
    }
   }
   progress.done++;
   if((progress.done%3===0||progress.done===progress.total)&&
       (s.tab==='futures'||s.tab==='overview'))renderLive();
  }
 }
 await Promise.all([worker(),worker()]);
 persistBybitHistory();
 return combineBybitChunks(results,from,anchor,period);
}
async function loadFuturesPeriod(period){
 if(period==='30d'||!s.bybitExpectedIds?.length||!s.backendConnection.available)return;
 if(s.periodLoading[period]||Date.now()<(s.periodErrorRetryAt[period]||0))return;
 const long='60d'||period==='90d'||period==='6m'||period==='1y'||period==='all';
 // Long-range analysis is day-aligned so it can reuse downloaded 6-day
 // slices. The current UTC day's operations are shown separately.
 const anchor=long?Math.floor(Date.now()/86400000)*86400000:
   (s.monthlyAnchorMs||Math.floor(Date.now()/300000)*300000);
 const ids=[...s.bybitExpectedIds];
 const already=ids.every(id=>{
  const v=s.periodReports[period]?.[id];
  return v&&Number.isFinite(v.netPnl)&&v.to===anchor&&
   (long||Date.now()-v.receivedAt<600000);
 });
 if(already)return;
 s.periodLoading[period]=true;
 s.periodReports[period] ||= {};
 if(long){
  const duration=period==='all'?729*86400000:PERIODS[period];
  const from=anchor-duration,interval=6*86400000;
  let windows=0;
  for(let t=from;t<anchor;t=Math.min(anchor,(Math.floor(t/interval)+1)*interval))windows++;
  s.periodProgress[period]={done:0,total:windows*ids.length};
 }
 try{
  await Promise.all(ids.map(async id=>{
   const prev=s.periodReports[period][id];
   if(prev&&Number.isFinite(prev.netPnl)&&prev.to===anchor&&
      (long||Date.now()-prev.receivedAt<600000))return;
   try{
    let data;
    if(long)data=await fetchLongBybitPeriod(id,period,anchor);
    else{
     const url='./api/period-performance?id='+encodeURIComponent(id)+
       '&period='+encodeURIComponent(period)+'&endAt='+anchor;
     const response=await fetch(url,{cache:'no-store',credentials:'same-origin'});
     data=await response.json();
     if(!response.ok)throw Error(data.error||'Не удалось получить историю Bybit');
    }
    if(data&&data.to===anchor&&Number.isFinite(data.netPnl)&&Array.isArray(data.points)){
     s.periodReports[period][id]={...data,receivedAt:Date.now()};
     delete s.periodErrors[period];
     delete s.periodErrorRetryAt[period];
     persistBybitHistory();
    }else{
     s.periodErrors[period]='История Bybit неполная';
     s.periodErrorRetryAt[period]=Date.now()+60000;
    }
   }catch(error){
    // A network or Bybit failure must not erase the last confirmed chart.
    s.periodErrors[period]=String(error.message||'История Bybit недоступна').slice(0,150);
    s.periodErrorRetryAt[period]=Date.now()+60000;
   }
  }));
 }finally{
  delete s.periodLoading[period];
  delete s.periodProgress[period];
  if(s.tab==='futures'||s.tab==='overview')renderLive();
 }
}


async function loadSpotHistory(period){
 if(!['30d','60d','90d','6m','1y','all'].includes(period)||
    !s.backendConnection.available||s.spotHistoryLoading[period])return;
 const today=Math.floor(Date.now()/86400000)*86400000;
 const prev=s.spotHistoricalReports[period];
 if(prev&&prev.to===today&&Date.now()-prev.receivedAt<3600000)return;
 s.spotHistoryLoading[period]=true;
 try{
  const response=await fetch('./api/spot-price-history?period='+encodeURIComponent(period),
    {cache:'no-store',credentials:'same-origin'});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'История цен Bybit недоступна');
  if(!data.prices||!Array.isArray(data.prices.BTC)||!Array.isArray(data.prices.ETH))
   throw Error('Bybit вернул неполные цены Spot');
  s.spotHistoricalReports[period]={...data,receivedAt:Date.now()};
 }catch(e){
  s.spotHistoricalReports[period]={error:String(e.message||'Не удалось загрузить Spot').slice(0,145),
   to:today,receivedAt:Date.now()};
 }finally{
  delete s.spotHistoryLoading[period];
  if(s.tab==='overview')renderLive();
 }
}
function overviewSpotHistory(period){
 const record=s.spotHistoricalReports[period];
 if(!record?.prices)return null;
 const dates=record.prices.BTC.map(x=>Number(x.t)).filter(Number.isFinite);
 const eth=new Map(record.prices.ETH.map(x=>[Number(x.t),Number(x.close)]));
 const btc=new Map(record.prices.BTC.map(x=>[Number(x.t),Number(x.close)]));
 const entries=s.trades.filter(t=>['BTC','ETH'].includes(t.coin)&&
  Number(t.spent)>0&&Number(t.entry)>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.buy_date))
  .map(t=>({...t,bought:Date.parse(t.buy_date+'T00:00:00Z')}));
 if(!entries.length)return null;
 const points=[];
 for(const day of dates.sort((a,b)=>a-b)){
  const btcPrice=btc.get(day),ethPrice=eth.get(day);
  if(!(btcPrice>0&&ethPrice>0))continue;
  let current=0,cost=0;
  for(const trade of entries){
   if(trade.bought>day)continue;
   const close=trade.coin==='BTC'?btcPrice:ethPrice;
   current+=Number(trade.spent)/Number(trade.entry)*close;
   cost+=Number(trade.spent);
  }
  points.push({t:day+86399999,v:current-cost});
 }
 if(points.length<2)return null;
 return {points,from:points[0].t,to:points.at(-1).t,
  provisional:entries.some(t=>!t.confirmed)};
}
function overviewHistoryData(mode,period){
 const spot=overviewSpotHistory(period),futures=futuresLedgerData(period);
 if(mode==='spot'){
  if(!spot)return null;
  const baseline=spot.points[0].v;
  return {points:spot.points.map(p=>({t:p.t,v:p.v-baseline})),
   coverage:spot.from,provisional:spot.provisional,
   description:'Изменение оценки записанных покупок BTC и ETH по историческим ценам Bybit Spot'};
 }
 if(mode==='futures'){
  if(!futures)return null;
  return {points:futures.points,coverage:futures.from,
   description:'Реализованные сделки Bybit, funding и комиссии · без открытого PNL'};
 }
 if(!spot||!futures)return null;
 const earliest=Math.max(spot.from,futures.from),latest=Math.min(spot.to,futures.to);
 const usable=spot.points.filter(p=>p.t>=earliest&&p.t<=latest);
 if(usable.length<2)return null;
 const fut=futures.points,firstSpot=usable[0].v;
 let index=0,lastValue=0;
 const output=[];
 for(const point of usable){
  while(index<fut.length&&fut[index].t<=point.t){lastValue=fut[index].v;index++}
  if(!output.length)output.push({t:point.t,v:0,baseFut:lastValue});
  else output.push({t:point.t,v:point.v-firstSpot+lastValue-output[0].baseFut});
 }
 return {points:output.map(({t,v})=>({t,v})),coverage:usable[0].t,
  provisional:spot.provisional,
  description:'Совместный доступный период: изменение Spot + реализованный PNL фьючерсов'};
}

function pnlWindow(kind,period,metric='pnl'){
 const windowMs=PERIODS[period]??PERIODS['7d'];
 const from=windowMs===Infinity?-Infinity:Date.now()-windowMs;
 const all=kind==='futures'&&metric==='realized30d'?monthlyFuturesSeries():pnlSeries(kind,metric).points;
 const observed=kind==='futures'&&metric==='realized30d'?all:all.filter(p=>p.t>=from).slice(-1500);
 // Live PNL is a lifetime account reading. For a selected interval, plot its
 // CHANGE from the first observed reading, not the historic loss as a flat line.
 // Never invent history before the first stored snapshot.
 const baseline=observed[0]?.v;
 const points=metric==='pnl'&&Number.isFinite(baseline)?
   observed.map(p=>({t:p.t,v:p.v-baseline})):observed;
 return {all,points,from,first:points.length?points[0].t:null,last:points.length?points[points.length-1].t:null};
}
function balanceSeries(kind,period){
 const windowMs=PERIODS[period]??PERIODS['7d'];
 const from=windowMs===Infinity?-Infinity:Date.now()-windowMs;
 const field=kind==='spot'?'spotBalance':'futuresBalance';
 const points=s.portfolioSnapshots.map(p=>({t:Number(p.time),v:p[field]==null?null:Number(p[field])}))
  .filter(p=>Number.isFinite(p.t)&&p.t>=from&&p.v!==null&&Number.isFinite(p.v)&&p.v>=0)
  .sort((a,b)=>a.t-b.t).slice(-1500);
 return {points,from,first:points[0]?.t??null,last:points.at(-1)?.t??null};
}
function chartHTML(kind,period,metric='pnl',externalPoints=null,axisUnit='usd'){

 if(data.length<2)return '<div class="emptychart"><strong>История '+(balance?'баланса':'PNL')+' формируется</strong><span>Здесь появится история измерений без выдуманных значений.</span></div>';
 const start=data[0].t,end=data[data.length-1].t,W=660,H=224,L=65,R=16,T=14,B=39;
 const vals=data.map(x=>x.v),min=balance?Math.min(...vals):Math.min(0,...vals),max=balance?Math.max(...vals):Math.max(0,...vals);
 const spread=Math.max(max-min,balance?Math.abs(max)*.003:.25,.01),low=min-.18*spread,high=max+.18*spread;
 const x=t=>L+(t-start)/Math.max(1,end-start)*(W-L-R),y=v=>T+(high-v)/(high-low)*(H-T-B);
 const axis=n=>axisUnit==='pct'?(n<0?'−':'+')+Math.abs(n).toFixed(2)+'%':balance?dollars(n):axisMoney(n);
 let guide='';
 for(let k=0;k<=4;k++){let value=high-(high-low)*k/4,cy=y(value);guide+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+cy.toFixed(1)+'" y2="'+cy.toFixed(1)+'" class="chartGrid"/><text x="'+(L-9)+'" y="'+(cy+4).toFixed(1)+'" text-anchor="end" class="chartAxis">'+axis(value)+'</text>'}
 const f=t=>period==='24h'||end-start<86400000?new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString('ru-RU',{month:'short',day:'numeric',year:period==='all'||period==='1y'?'2-digit':undefined});
 for(const fraction of [0,.5,1]){const tick=L+fraction*(W-L-R);guide+='<text x="'+tick+'" y="'+(H-10)+'" text-anchor="'+(fraction===0?'start':fraction===1?'end':'middle')+'" class="chartAxis">'+escape(f(start+(end-start)*fraction))+'</text>'}
 const pts=data.map(p=>x(p.t).toFixed(1)+','+y(p.v).toFixed(1)).join(' '),last=data[data.length-1],color=balance?'var(--text)':last.v<0?'var(--red)':'var(--green)';
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="График '+(balance?'баланса':'PNL')+' с датами и значениями"><g>'+guide+'</g>'+(balance?'':'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" class="chartZero"/>')+'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+x(last.t).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="4" fill="'+color+'"><title>'+escape(axis(last.v)+' · '+new Date(last.t).toLocaleString('ru-RU'))+'</title></circle></svg>';

function pnlChartBlock(opts){

function pnlThirtyDayDelta(kind='all'){
 // Difference in observed floating PNL, not exchange-reported realized profit.
 // Only show it when we really have a baseline around 30 days ago.
 const series=pnlSeries(kind).points,cutoff=Date.now()-PERIODS['30d'];
 if(series.length<2)return null;
 const baseline=series.filter(p=>Math.abs(p.t-cutoff)<=12*3600000)
  .sort((a,b)=>Math.abs(a.t-cutoff)-Math.abs(b.t-cutoff))[0];
 const latest=series.at(-1);
 if(!baseline||!latest||latest.t<=cutoff||Date.now()-latest.t>6*3600000)return null;
 return latest.v-baseline.v;
}

function positionAge(time,now=Date.now()){
 const opened=Number(time);
 if(!Number.isFinite(opened)||opened<1e12||opened>now)return '—';
 const minutes=Math.max(0,Math.floor((now-opened)/60000));
 const days=Math.floor(minutes/1440),hours=Math.floor(minutes%1440/60);
 if(days>=1)return days+' д '+hours+' ч';
 if(hours>=1)return hours+' ч '+(minutes%60)+' мин';

}

function positionCostsFromBybit(p){
 if(p.exchangeId!=='bybit')return {reason:'Нет данных Bybit'};
 const report=s.monthlyPerformance[p.accountId];
 if(!report||!Array.isArray(report.costEvents)||report.costEventsComplete!==true)
  return {reason:'Детализация Bybit пока недоступна'};
 const opened=Number(p.openedAt);
 if(!Number.isFinite(opened)||opened<1e12)
  return {reason:'Bybit не передал дату открытия'};
 if(opened<Number(report.from)||opened>=Number(report.to))
  return {reason:'Открыта до начала доступной истории или отчёт ещё не обновлён'};
 // A single account can have two opposite hedged positions for one symbol.
 // Transaction-log is keyed by symbol, not positionIdx. Never assign the
 // same fees to both positions.
 const ambiguous=s.futuresPositions.filter(x=>x.exchangeId==='bybit'&&
  x.accountId===p.accountId&&x.symbol===p.symbol);
 if(ambiguous.length>1)
  return {reason:'Для этой монеты несколько позиций, расходы нельзя разделить'};
 let funding=0,fees=0;
 for(const event of report.costEvents){
  if(event.symbol!==p.symbol)continue;
  const t=Number(event.t),f=Number(event.funding),fee=Number(event.fees);
  if(!Number.isFinite(t)||!Number.isFinite(f)||!Number.isFinite(fee))
   return {reason:'Некорректная запись расходов Bybit'};
  if(t>=opened&&t<report.to){funding+=f;fees+=fee}
 }
 return {funding,fees,opened,through:report.to};
}

function reconcileLive(current,next){
 if(next.nodeType===11){
  // A template fragment supplies new children, not a replacement workspace.
  reconcileLiveChildren(current,next);return;
 }
 if(current.nodeType!==next.nodeType||
    (current.nodeType===1&&current.tagName!==next.tagName)){
  current.replaceWith(next.cloneNode(true));return;
 }
 if(current.nodeType===3||current.nodeType===8){
  if(current.nodeValue!==next.nodeValue)current.nodeValue=next.nodeValue;
  return;
 }
 if(current.nodeType!==1)return;
 // These separate widgets own their DOM (including the buy-level editor).
 if(current.id==='strategyMount'||current.id==='bybitConnectionPanel')return;
 const active=document.activeElement;
 if(current.tagName==='FORM'&&active&&current.contains(active))return;
 if(current.isContentEditable||(current===active&&/^(INPUT|TEXTAREA|SELECT)$/.test(current.tagName)))return;
 for(const a of Array.from(current.attributes)){
  if(!next.hasAttribute(a.name))current.removeAttribute(a.name);
 }
 for(const a of Array.from(next.attributes)){
  if(current.getAttribute(a.name)!==a.value)current.setAttribute(a.name,a.value);
 }
 reconcileLiveChildren(current,next);
}
function reconcileLiveChildren(current,next){
 const oldChildren=Array.from(current.childNodes),newChildren=Array.from(next.childNodes);
 for(let i=0,n=Math.max(oldChildren.length,newChildren.length);i<n;i++){
  if(!oldChildren[i])current.appendChild(newChildren[i].cloneNode(true));
  else if(!newChildren[i])oldChildren[i].remove();
  else reconcileLive(oldChildren[i],newChildren[i]);
 }
}
function renderLive(){
 const views={overview,positions,futures,connections},html=(views[s.tab]||overview)();
 const content=$('content');
 if(typeof document.createElement==='function'&&content?.childNodes){
  const template=document.createElement('template');
  template.innerHTML=html;
  reconcileLive(content,template.content);
 }else if(content.innerHTML!==html){
  // DOM-less unit-test fallback; real browsers use the incremental branch.
  content.innerHTML=html;
 }
 updateChrome();
 window.fxmr4Levels?.refreshQuotes?.();
 if(s.tab==='futures'&&s.futuresView==='pnl'&&s.chartPeriod.futures!=='30d')void loadFuturesPeriod(s.chartPeriod.futures);

  function compactBybitReport(v){
   if(!v||!Number.isFinite(v.from)||!Number.isFinite(v.to)||
      !Number.isFinite(v.netPnl)||!Array.isArray(v.points)||v.to<=v.from||
      v.to>Date.now()+86400000)return null;
   // Cost events are deliberately not persisted: a position fee must be
   // rechecked against the current exact open time after reconnection.
   return {from:v.from,to:v.to,netPnl:v.netPnl,tradingPnl:v.tradingPnl||0,
    funding:v.funding||0,fees:v.fees||0,period:v.period||'',
    points:v.points.slice(-10000),days:(v.days||[]).slice(-750),
    symbols:(v.symbols||[]).slice(0,100),
    receivedAt:Number(v.receivedAt)||Date.now(),
    costEvents:[],costEventsComplete:false};
  }
  function saveBoundedCache(key,records,maxChars=1850000){
   try{
    const sorted=records.filter(x=>x&&Array.isArray(x)&&x.length===3)
     .sort((a,b)=>(b[2].receivedAt||0)-(a[2].receivedAt||0));
    let payload=JSON.stringify({version:1,rows:sorted});
    // Keep the most recently used complete reports if storage is limited.
    while(payload.length>maxChars&&sorted.length){
     sorted.pop();payload=JSON.stringify({version:1,rows:sorted});
    }
    localStorage.setItem(key,payload);
   }catch(e){/* History caching is optional; existing reports stay in RAM. */}
  }
  function persistBybitHistory(){
   const reports=[];
   for(const [id,p] of Object.entries(s.monthlyPerformance)){
    const v=compactBybitReport(p);
    if(v)reports.push(['30d',id,v]);
   }
   for(const [period,group] of Object.entries(s.periodReports)){
    if(!PERIODS[period])continue;
    for(const [id,p] of Object.entries(group||{})){
     const v=compactBybitReport(p);
     if(v)reports.push([period,id,v]);
    }
   }
   saveBoundedCache(historyCacheKey,reports);
   const chunks=[];
   for(const [key,entry] of Object.entries(s.periodChunkCache)){
    const v=compactBybitReport(entry?.data);
    if(v){
     const receivedAt=Number(entry.receivedAt)||Date.now();
     chunks.push(['chunk',key,{...v,receivedAt}]);
    }
   }
   saveBoundedCache(chunksCacheKey,chunks,1900000);
  }
  function restoreBybitHistory(){
   for(const key of [historyCacheKey,chunksCacheKey]){
    let rows;
    try{
     const saved=JSON.parse(localStorage.getItem(key)||'null');
     if(saved?.version!==1||!Array.isArray(saved.rows))continue;
     rows=saved.rows.slice(0,1500);
    }catch(e){continue}
    for(const entry of rows){
     if(!Array.isArray(entry)||entry.length!==3)continue;
     const [period,id,p]=entry;
     if(typeof id!=='string'||id.length>160)continue;
     const v=compactBybitReport(p);
     if(!v)continue;
     v.receivedAt=Number(p.receivedAt)||0;
     if(v.to<Date.now()-731*86400000)continue;
     if(key===chunksCacheKey){
      if(period!=='chunk')continue;
      const parts=id.split(':');
      if(parts.length<3)continue;
      const start=Number(parts.at(-2)),stop=Number(parts.at(-1));
      if(v.from!==start||v.to!==stop)continue;
      s.periodChunkCache[id]={data:v,receivedAt:v.receivedAt};
     }else if(period==='30d'){
      s.monthlyPerformance[id]=v;
     }else if(PERIODS[period]){
      (s.periodReports[period] ||= {})[id]=v;
     }
    }
   }
  }

  let historyPushAt=0;
  async function pushPnlHistory(force=false){
    if(!s.backendConnection.available)return;
    const now=Date.now();
    if(!force&&now-historyPushAt<300000)return;
    historyPushAt=now;
    // Send only what the server cannot already have: the recent live readings.
    const points=s.portfolioSnapshots.slice(-400).map(p=>({t:p.time,spot:p.spot,futures:p.futures,total:p.total,futuresAccount:p.futuresAccount,totalAccount:p.totalAccount}))
      .filter(p=>Number.isFinite(p.t)&&(Number.isFinite(p.total)||Number.isFinite(p.spot)));
    if(!points.length)return;
    try{
      await fetch('./api/pnl-history',{method:'POST',cache:'no-store',credentials:'same-origin',
        headers:{'Content-Type':'application/json','X-FXMR4-Action':'1'},
        body:JSON.stringify({points})});
    }catch(e){/* the next push retries; nothing is lost locally */}
  }
  function recordPortfolioSnapshot(){
    const summary=portfolioSummary();
    // Spot PNL exists even with no futures account, so it is recorded on its
    // own. Futures and total stay absent, never zero, while they are unknown.
    const p={time:Date.now(),spot:summary.spot.profit,spotBalance:summary.spot.holdings};
    if(summary.hasFutures){
      if(summary.futuresFloatingPnl!==null){
        p.futures=summary.futuresFloatingPnl;
        p.total=summary.spot.profit+summary.futuresFloatingPnl;
      }
      if(summary.futuresPnl!==null){
        p.futuresAccount=summary.futuresPnl;
        p.totalAccount=summary.spot.profit+summary.futuresPnl;
      }
      const equity=s.bybitSnapshot?.totals?.equity;
      if(equity!=null&&Number.isFinite(Number(equity)))p.futuresBalance=Number(equity);
    }else if(!hasTrackedFutures()&&!s.backendConnection.configured){
      p.total=summary.spot.profit;
    }
    const last=s.portfolioSnapshots[s.portfolioSnapshots.length-1];
    if(last&&p.time-last.time<1500&&Math.abs((last.totalAccount??last.total??last.spot)-(p.totalAccount??p.total??p.spot))<0.000001&&Math.abs((last.futures??0)-(p.futures??0))<0.000001)return;
    s.portfolioSnapshots.push(p);s.portfolioSnapshots=s.portfolioSnapshots.slice(-1500);
    pushPnlHistory();
  }

    const base=s.trades.filter(t=>t.id!==s.editing);
    if(base.filter(t=>t.coin===coin).reduce((a,t)=>a+Number(t.spent),0)+spent>C/2+0.0000001){s.formError='Лимит для '+coin+' составляет '+dollars(C/2)+'.';render();return}
    if(base.reduce((a,t)=>a+Number(t.spent),0)+spent>C+0.0000001){s.formError='Превышен общий бюджет $1 000.';render();return}
    const id=s.editing===null?Math.max(0,...s.trades.map(t=>Number(t.id)))+1:s.editing;
    const rec={id,coin,spent,entry,buy_date,account,confirmed:true};
    s.trades=s.editing===null?[...s.trades,rec]:s.trades.map(t=>t.id===id?rec:t);
    s.snapshots=[];s.points=[];s.form=false;s.editing=null;s.formError='';s.flash='Покупка сохранена. История PNL начнётся заново после изменения позиции.';recordSnapshot();saveLocal();render();
  }
  function removeTrade(id){
    s.trades=s.trades.filter(t=>t.id!==id);s.deleteId=null;s.snapshots=[];s.points=[];s.flash='Покупка удалена.';recordSnapshot();saveLocal();render();
  }
  function saveManualPrices(fd){
    const a=Number(fd.get('BTC')),b=Number(fd.get('ETH'));
    if(!(Number.isFinite(a)&&a>0&&Number.isFinite(b)&&b>0)){s.flash='Нужны корректные цены BTC и ETH.';render();return}
    const when=new Date().toISOString();
    s.quotes={BTC:{price:a,source:'Вручную',updated_at:when},ETH:{price:b,source:'Вручную',updated_at:when}};
    s.showPrices=false;s.sync=null;s.flash='Цены сохранены и PNL пересчитан.';recordSnapshot();saveLocal();render();
  }
function saveFutureForm(fd){
 const name=String(fd.get('name')||'').trim().slice(0,40);
 if(!name){s.futureFormError='Укажи название.';render();return}
 if(s.futureForm==='exchange'){
   if(s.sources.some(ex=>ex.name.toLowerCase()===name.toLowerCase())){s.futureFormError='Такая биржа уже добавлена.';render();return}
   const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36);
   s.sources.push({id,name,connected:false,accounts:[]});
   s.openedExchanges[id]=true;
 }else{
   const exchange=s.sources.find(ex=>ex.id===s.futureForm);
   if(!exchange){s.futureFormError='Биржа не найдена.';render();return}
   if(exchange.accounts.some(ac=>ac.name.toLowerCase()===name.toLowerCase())){s.futureFormError='Такой субаккаунт уже есть.';render();return}
   exchange.accounts.push({id:'sub-'+Date.now().toString(36),name,balance:null});
   s.openedExchanges[exchange.id]=true;
 }
 s.futureForm=null;s.futureFormError='';s.flash='Название сохранено. Для позиций потребуется API.';saveLocal();render();
}
function handleClick(e){
 const tab=e.target.closest('[data-tab]');
 if(tab){s.tab=tab.dataset.tab;s.flash='';s.form=false;s.deleteId=null;render();return}
 const pnl=e.target.closest('[data-pnl-mode]');
 if(pnl){s.pnlMode=pnl.dataset.pnlMode;saveLocal(false);render();return}
 const per=e.target.closest('[data-period]');
 const view=e.target.closest('[data-futures-view]');
  if(view){s.futuresView=view.dataset.futuresView;saveLocal(false);render();return}
  const unit=e.target.closest('[data-futures-unit]');
  if(unit){s.futuresValueMode=unit.dataset.futuresUnit;saveLocal(false);render();return}
  if(per){const key=per.dataset.chart||'overview';s.chartPeriod[key]=per.dataset.period;if(key==='overview')s.period=per.dataset.period;saveLocal(false);chart();render();return}
 const met=e.target.closest('[data-metric]');
 if(met){s.chartMetric[met.dataset.chart]=met.dataset.metric;if(met.dataset.metric==='realized30d')s.chartPeriod[met.dataset.chart]='30d';render();return}
 const sort=e.target.closest('[data-sort]');
 if(sort){const key=sort.dataset.sort;if(s.futureSort===key)s.futureSortDir*=-1;else{s.futureSort=key;s.futureSortDir=(key==='symbol'||key==='side')?1:-1}render();return}
 const mode=e.target.closest('[data-future-mode]');
 if(mode){
  s.futureMode=mode.dataset.futureMode;
  if(s.futureMode==='exchange'||s.futureMode==='account'){
   for(const ex of s.sources){
    if(s.futureMode==='exchange')s.openedExchanges[ex.id]=true;
    for(const ac of ex.accounts)s.openedAccounts[ex.id+':'+ac.id]=true;
   }
  }
  render();return
 }
 const btn=e.target.closest('[data-action]');if(!btn)return;
 const act=btn.dataset.action,id=btn.dataset.id||'';
 if(act==='sync'){sync();return}
 if(act==='exportFuturesCsv'){exportFuturesCSV();return}
 if(act==='gotoSpot'){s.tab='positions';render();return}
 if(act==='gotoFutures'||act==='backToFutures'){s.tab='futures';s.futureMode='exchange';render();return}
 if(act==='goConnections'){s.tab='connections';render();return}
 if(act==='toggleCapital'){s.capitalOpen=!s.capitalOpen;render();return}
 if(act==='toggleTheme'){const mode=currentTheme()==='dark'?'light':'dark';setTheme(mode);return}
 if(act==='gotoOverview'){s.tab='overview';render();return}
 if(act==='manageAccount'){s.tab='connections';s.pendingRemove=null;render();return}
 if(act==='removeAccount'){s.pendingRemove=id;s.renameId=null;render();return}
 if(act==='cancelRemoveAccount'){s.pendingRemove=null;render();return}
 if(act==='confirmRemoveAccount'){removeAccount(id);return}
 if(act==='renameAccount'){s.renameId=id;s.renameValue='';s.renameError='';s.pendingRemove=null;saveLocal(false);render();return}
 if(act==='cancelRenameAccount'){s.renameId=null;s.renameValue='';s.renameError='';render();return}
 if(act==='saveRenameAccount'){saveRenameAccount(id);return}
 if(act==='prices'){s.showPrices=!s.showPrices;render();return}
 if(act==='toggleExchange'){
   const expandedByDefault=s.tab==='futures'&&s.futureMode==='exchange';
   s.openedExchanges[id]=expandedByDefault?s.openedExchanges[id]===false:!s.openedExchanges[id];
   render();return
  }
 if(act==='toggleAccount'){
   const expandedByDefault=s.tab==='futures'&&s.futureMode!=='all';
   s.openedAccounts[id]=expandedByDefault?s.openedAccounts[id]===false:!s.openedAccounts[id];
   render();return
  }
 if(act==='toggleSpotCoin'){s.spotOpen[id]=!s.spotOpen[id];render();return}
 if(act==='toggleHistory'){s.spotHistoryOpen=!s.spotHistoryOpen;s.form=false;render();return}
 if(act==='toggleSpotAccounts'){s.spotAccountsOpen=!s.spotAccountsOpen;render();return}
 if(act==='new'){formOpen();return}
 if(act==='edit'){formOpen(Number(id));return}
 if(act==='delete'){s.deleteId=Number(id);render();return}
 if(act==='cancelDelete'){s.deleteId=null;render();return}
 if(act==='confirmDelete'){removeTrade(Number(id));return}
 if(act==='closeForm'){s.form=false;s.formError='';render();return}
}
function handleSubmit(e){
 if(e.target.id==='tradeForm'){e.preventDefault();saveTrade(new FormData(e.target))}
 if(e.target.id==='priceForm'){e.preventDefault();saveManualPrices(new FormData(e.target))}
 if(e.target.classList?.contains('settingsRenameForm')){e.preventDefault();saveRenameAccount(e.target.dataset.renameId)}
 if(e.target.id==='capitalForm'){e.preventDefault();saveCapital(new FormData(e.target))}
}
function handleChange(e){
 if(e.target.matches?.('[data-overview-period]')){
  s.chartPeriod.overview=e.target.value;
  s.period=e.target.value;
  saveLocal(false);render();return;
 }
 if(e.target.matches?.('[data-futures-account]')){s.futuresAccountFilter=e.target.value;render();return}
 if(e.target.id==='coin'&&s.editing===null){const input=$('entry');if(input)input.value=Number(s.quotes[e.target.value]?.price||initial[e.target.value])}
}
  document.addEventListener('click',handleClick);
  document.addEventListener('submit',handleSubmit);
  document.addEventListener('change',handleChange);
  window.fxmr4GetState=()=>({tab:s.tab,quotes:s.quotes,holdings:{BTC:coin('BTC'),ETH:coin('ETH')},capital:C});
  // Standalone web preview. Every edit is saved only in this browser, never to a public repository.
  loadLocal();
  restoreBybitHistory();
  // Switch this existing install from the old 24-hour view to the entire
  // recorded history once, without overriding later user period selections.
  try{
   const rangeMigration='fxmr4_chart_range_all_v1';
   if(!localStorage.getItem(rangeMigration)){
    s.chartPeriod.overview='all';
    s.chartPeriod.spot='all';
    s.period='all';
    localStorage.setItem(rangeMigration,'1');
    saveLocal(false);
   }
  }catch(e){/* Stored chart preferences remain optional. */}
  try{
   const reportMigration='fxmr4_futures_report_default_v1';
   if(!localStorage.getItem(reportMigration)){
    s.chartMetric.futures='realized30d';
    s.chartPeriod.futures='30d';
    localStorage.setItem(reportMigration,'1');
    saveLocal(false);
   }
  }catch(e){/* Never prevent the dashboard from loading. */}
  try{
   const overviewUpgrade='fxmr4_overview_historical_tabs_v3';
   if(!localStorage.getItem(overviewUpgrade)){
    s.pnlMode='all';s.chartPeriod.overview='30d';s.period='30d';
    localStorage.setItem(overviewUpgrade,'1');saveLocal(false);
   }
  }catch(e){/* Initial chart still works without localStorage. */}
  render();chart();sync({quiet:true});loadPnlHistory();
  setInterval(()=>{if(!document.hidden&&!s.busy)sync({quiet:true})},60000);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
     loadPnlHistory();
     if(Date.now()-lastSyncAttempt>60000)sync({quiet:true});
    }
   });
   setInterval(()=>{if(!document.hidden)loadPnlHistory()},300000);
})();
</script>
